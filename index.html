<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StoryForge 집필실</title>
<meta name="description" content="원고와 세계관을 GitHub 저장소에 버전별로 보관하는 소설 집필 도구">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2333479B'/%3E%3Cpath d='M9 8h9a5 5 0 0 1 0 10h-9zM9 18h10a5 5 0 0 1 0 10H9z' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
:root{
  --bg:#E9ECF1; --panel:#F4F5F8; --paper:#FFFFFF; --ink:#19202F; --ink2:#465068; --mute:#737B91;
  --line:#D5DAE3; --line2:#E4E7ED; --hover:#E6E9F0;
  --acc:#33479B; --acc-soft:#E2E6F6; --acc-ink:#FFFFFF;
  --red:#B43A33; --red-soft:#F6E2E0; --org:#B0631A; --org-soft:#F6EADC; --yel:#8E760C; --yel-soft:#F3EDD3;
  --blu:#2C68A6; --blu-soft:#DFEAF6; --grn:#2B7A57; --grn-soft:#DDEFE5; --gry:#6B7285; --gry-soft:#E7E9EE;
  --serif:'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1218; --panel:#151920; --paper:#1B2029; --ink:#E2E5EC; --ink2:#B2B8C8; --mute:#878EA3;
    --line:#2B313E; --line2:#232936; --hover:#232937;
    --acc:#91A2EC; --acc-soft:#252D4C; --acc-ink:#0F1218;
    --red:#E6817A; --red-soft:#3A2325; --org:#E1A064; --org-soft:#382A1C; --yel:#D8C067; --yel-soft:#343019;
    --blu:#7FB0E6; --blu-soft:#1D2C3E; --grn:#79C9A1; --grn-soft:#1B3128; --gry:#9EA5B7; --gry-soft:#262B36;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1218; --panel:#151920; --paper:#1B2029; --ink:#E2E5EC; --ink2:#B2B8C8; --mute:#878EA3;
  --line:#2B313E; --line2:#232936; --hover:#232937;
  --acc:#91A2EC; --acc-soft:#252D4C; --acc-ink:#0F1218;
  --red:#E6817A; --red-soft:#3A2325; --org:#E1A064; --org-soft:#382A1C; --yel:#D8C067; --yel-soft:#343019;
  --blu:#7FB0E6; --blu-soft:#1D2C3E; --grn:#79C9A1; --grn-soft:#1B3128; --gry:#9EA5B7; --gry-soft:#262B36;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{height:100%;display:grid;grid-template-columns:248px minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr) auto}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand b{font-family:var(--serif);font-weight:800;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topsearch{flex:0 1 260px;min-width:0}
.topsearch input{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.iconbtn{display:none;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 10px;font-size:13px;flex:none}

.side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 12px 24px}
.side h4{margin:18px 6px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.side h4:first-child{margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;color:var(--ink2)}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--acc-soft);color:var(--ink);font-weight:500}
.nav .n{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.ch{margin-bottom:4px}
.chbtn{width:100%;display:flex;gap:8px;align-items:baseline;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;color:var(--ink)}
.chbtn:hover{background:var(--hover)}
.chbtn .no{font-family:var(--serif);font-weight:700;font-size:13px;white-space:nowrap}
.chbtn .t{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scs{display:flex;flex-direction:column;margin-left:14px;border-left:1px solid var(--line);padding-left:4px}
.scbtn{text-align:left;border:0;background:transparent;padding:4px 8px;border-radius:6px;color:var(--ink2);font-size:13px;display:flex;justify-content:space-between;gap:6px}
.scbtn:hover{background:var(--hover)}
.scbtn.on{background:var(--acc-soft);color:var(--ink);font-weight:500}
.scbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none;align-self:center}
.addlink{border:0;background:transparent;color:var(--acc);font-size:12.5px;padding:4px 8px;text-align:left}
.addlink:hover{text-decoration:underline}

.main{overflow:auto;background:var(--bg);min-width:0}
.ai{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 14px 24px}
.status{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;border-top:1px solid var(--line);background:var(--panel);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.status span{padding:0 12px;border-left:1px solid var(--line)}
.status span:first-child{padding-left:0;border-left:0}
.status .warn{color:var(--red);font-weight:500}
.status .save{margin-left:auto;border-left:0}

/* writing */
.write{max-width:max(820px, calc(var(--ms-cols,38) * var(--ms-size,17px) + 140px));margin:0 auto;padding:22px 24px 40px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.whead{display:flex;flex-direction:column;gap:6px}
.chrow{display:flex;align-items:baseline;gap:10px}
.chno{font-family:var(--serif);font-weight:800;font-size:14px;color:var(--acc);white-space:nowrap}
.chtitle{border:0;background:transparent;font-family:var(--serif);font-size:14px;color:var(--ink2);padding:2px 0;flex:1;min-width:0}
.sctitle{border:0;background:transparent;font-family:var(--serif);font-weight:800;font-size:26px;letter-spacing:-.01em;padding:2px 0;width:100%}
.chtitle:focus,.sctitle:focus{outline:none;border-bottom:1px dashed var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--mute)}
.meta label{display:flex;align-items:center;gap:6px}
.meta select,.meta input{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:3px 6px;font-size:12.5px;max-width:170px}
details.sum summary{cursor:pointer;font-size:12.5px;color:var(--mute)}
details.sum textarea{margin-top:6px;width:100%;min-height:60px;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:8px 10px;resize:vertical;font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line2)}
.tools .lbl{font-size:11.5px;color:var(--mute);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.chip:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.chip:disabled{opacity:.45;cursor:default}
.chip.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip.pri:hover:not(:disabled){filter:brightness(1.08);color:var(--acc-ink)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.ms{flex:1;min-height:56vh;width:100%;border:1px solid var(--line2);border-radius:var(--r);background:var(--ms-bg,var(--paper));color:var(--ms-ink,var(--ink));padding-block:34px;padding-inline:max(18px, calc((100% - var(--ms-cols,38) * 1em) / 2));font-family:var(--ms-font,var(--serif));font-size:var(--ms-size,17px);line-height:var(--ms-lh,1.95);resize:vertical;box-shadow:0 1px 2px rgba(20,30,60,.05)}
.ms::placeholder{color:var(--ms-ink,var(--mute));opacity:.45}
.ms:focus{outline:none;border-color:var(--line)}
.wfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.wfoot .grp{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 11px;font-size:12.5px;color:var(--ink2)}
.btn:hover{border-color:var(--ink2)}
.btn.danger{color:var(--red)}
.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* collection views */
.view{padding:22px 24px 40px;max-width:1080px;margin:0 auto}
.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px}
.vhead h2{margin:0;font-family:var(--serif);font-weight:800;font-size:24px;text-wrap:balance}
.vhead p{margin:4px 0 0;color:var(--mute);font-size:13px;max-width:60ch}
.split{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:18px;align-items:start}
.list{display:flex;flex-direction:column;gap:6px}
.card{text-align:left;border:1px solid var(--line2);background:var(--paper);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;width:100%}
.card:hover{border-color:var(--line)}
.card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.card .ct{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .cs{font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.detail{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:18px 20px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:12px;color:var(--mute);font-weight:500}
.fld.secret>span{color:var(--red)}
.fld.secret>span::after{content:" · 독자 비공개";font-weight:400}
.fld input:not([type=checkbox]),.fld select,.fld textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;width:100%}
.fld textarea{min-height:70px;resize:vertical;line-height:1.6}
.fld.secret textarea{background:var(--red-soft);border-color:transparent}
.fld select[multiple]{min-height:96px}
.chk{flex-direction:row;align-items:center;gap:8px}
.dfoot{display:flex;justify-content:flex-end;margin-top:16px}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:18px;margin-bottom:6px}

.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;font-family:var(--sans)}
.p-red{background:var(--red-soft);color:var(--red)} .p-org{background:var(--org-soft);color:var(--org)}
.p-yel{background:var(--yel-soft);color:var(--yel)} .p-blu{background:var(--blu-soft);color:var(--blu)}
.p-grn{background:var(--grn-soft);color:var(--grn)} .p-gry{background:var(--gry-soft);color:var(--gry)}
.p-acc{background:var(--acc-soft);color:var(--acc)}

.knows{display:flex;flex-direction:column;gap:6px}
.knrow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:6px;align-items:center}
.knrow button{border:0;background:transparent;color:var(--mute);padding:4px 6px}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tlrow{position:relative;margin-bottom:6px}
.tlrow::before{content:"";position:absolute;left:-20px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--acc)}
.tlrow.imp3::before{background:var(--acc)}
.tlgap{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin:10px 0 12px -2px;letter-spacing:.04em}
.yr{font-family:var(--mono);font-size:11.5px;color:var(--acc);font-weight:500}

/* graph */
.graphwrap{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);overflow-x:auto}
.graphwrap svg{display:block;width:100%;min-width:520px;height:auto}
.gnode rect{fill:var(--panel);stroke:var(--line)}
.gnode text{fill:var(--ink);font-family:var(--serif);font-weight:700;font-size:14px}
.gnode{cursor:pointer}
.gnode:hover rect{stroke:var(--acc)}
.gedge path{fill:none;stroke:var(--ink2);stroke-width:1.4;opacity:.55}
.gedge.hid path{stroke-dasharray:5 4}
.gedge text{fill:var(--ink2);font-size:11.5px;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.gedge{cursor:pointer}
.gedge .hit{stroke:transparent;stroke-width:14;opacity:1}
.gedge.on path:not(.hit){stroke:var(--acc);opacity:1;stroke-width:2.2}
.gedge.on text{fill:var(--acc);font-weight:600}
.evid{white-space:pre-line;font-size:13px;color:var(--ink2);border-left:2px solid var(--acc);padding-left:10px;margin-top:4px}

/* AI panel */
.aih{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.aih b{font-family:var(--serif);font-weight:800;font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.tile{border:1px solid var(--line2);background:var(--paper);border-radius:var(--r);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:0;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.tile.t-red::before{background:var(--red)} .tile.t-org::before{background:var(--org)} .tile.t-yel::before{background:var(--yel)} .tile.t-blu::before{background:var(--blu)}
.tile .v{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .l{font-size:11.5px;color:var(--mute)}
.tile.on{border-color:var(--acc)}
.work{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.work h5{margin:0;font-size:12px;letter-spacing:.06em;color:var(--acc);text-transform:uppercase}
.work .orig{font-family:var(--serif);font-size:13px;color:var(--mute);border-left:2px solid var(--line);padding-left:8px;max-height:110px;overflow:auto;white-space:pre-wrap}
.work .out{font-family:var(--serif);font-size:14px;line-height:1.8;white-space:pre-wrap;max-height:340px;overflow:auto}
.work .row{display:flex;gap:6px;flex-wrap:wrap}
.work textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;min-height:64px;resize:vertical;width:100%}
.thinking{color:var(--mute);font-size:13px;display:flex;align-items:center;gap:8px}
.thinking::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 1.1s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.beat{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:7px 9px;font-size:13px;width:100%}
.beat .o{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--mute)}
.beat.on{border-color:var(--acc)}
.beat.on .o{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.iss{border-top:1px solid var(--line2);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.iss .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.iss .loc{font-size:12px;color:var(--mute)}
.iss q{font-family:var(--serif);font-size:13px;color:var(--ink);quotes:"“" "”"}
.iss .msg{font-size:13px;color:var(--ink2)}
.iss .basis{font-size:11.5px;color:var(--mute)}
.iss .row{display:flex;gap:6px;margin-top:2px}
.note{font-size:12.5px;color:var(--mute);background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.sech{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:16px 0 4px}

/* search / style */
.sbox{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sbox input{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:15px}
.res{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.res:hover{border-color:var(--acc)}
.res .rt{font-weight:600;display:flex;gap:8px;align-items:center}
.res .sn{font-family:var(--serif);font-size:13.5px;color:var(--ink2)}
mark{background:var(--yel-soft);color:var(--ink);padding:0 1px;border-radius:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.stat{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.prose{font-family:var(--serif);font-size:14.5px;line-height:1.85;white-space:pre-wrap;max-width:65ch}
.panel2{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.panel2 h3{margin:0 0 10px;font-size:14px}
.loading{display:grid;place-items:center;height:100%;color:var(--mute)}

.scrim{display:none}
@media (max-width:1100px){
  .app{grid-template-columns:220px minmax(0,1fr) 290px}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .iconbtn{display:inline-block}
  .topsearch{display:none}
  .side,.ai{position:fixed;top:0;bottom:0;z-index:30;width:min(320px,88vw);padding-top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 0 30px rgba(0,0,0,.2)}
  .side{left:0}
  .ai{right:0;left:auto;transform:translateX(105%)}
  .side.open,.ai.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,14,22,.35);z-index:25}
  .split{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:minmax(0,1fr)}
  .write{padding:16px 16px 32px}
  .view{padding:16px 16px 32px}
  .sctitle{font-size:22px}
  .brand span{display:none}
}

/* GitHub / 버전 기록 */

<script>
/* js/format.js */
/*
 * StoryForge 저장 형식
 *
 * 작품 하나를 저장소 안의 폴더 하나로 저장합니다.
 *
 *   project.json                   작품 정보
 *   manuscript/<장 id>.md          장 하나 = Markdown 파일 하나 (장면 여러 개)
 *   characters/<인물 id>.json      인물 한 명 = 파일 하나
 *   characters/_relationships.json 인물 관계
 *   world/lore.json                세계관
 *   places/places.json             장소
 *   timeline/events.json           연표
 *   foreshadowing/clues.json       복선
 *   items/items.json               아이템
 *   ai/style_profile.json          문체 프로필
 *   ai/issues.json                 AI 편집자가 찾은 이슈
 *   ai/plans.json                  AI 전개 구상 (저장한 것만)
 *
 * 원고를 Markdown으로 두는 이유: GitHub에서 문장 단위로 변경 내역(diff)을
 * 읽을 수 있고, 웹에서 바로 읽기 좋게 렌더링되기 때문입니다.
 */
(function (root) {
  'use strict';

  const FORMAT = 'storyforge';
  const VERSION = 1;
  const MANAGED = ['project.json', 'manuscript/', 'characters/', 'world/', 'places/', 'timeline/', 'foreshadowing/', 'items/', 'ai/'];

  const pretty = o => JSON.stringify(o, null, 2) + '\n';
  const safeName = id => String(id).replace(/[^A-Za-z0-9_\-.]/g, '_');
  // HTML 주석 안에 JSON을 넣으므로 "--" 가 생기지 않게 막는다 (JSON 문자열 안에서 - 는 같은 글자)
  const inlineJSON = o => JSON.stringify(o).replace(/--/g, '-\\u002d');

  function emptyState() {
    return {
      meta: { title: '새 작품', genre: '', author: '', description: '', dismissed: [] },
      style: { summary: '', preferred: '', forbidden: '' },
      chapters: [], scenes: [], characters: [], relations: [], lore: [], places: [], events: [], clues: [], items: [], issues: [], plans: []
    };
  }

  function chapterToMarkdown(ch, scenes) {
    const fm = ['---',
      'id: ' + JSON.stringify(ch.id),
      'order: ' + JSON.stringify(ch.order || 0),
      'title: ' + JSON.stringify(ch.title || ''),
      'summary: ' + JSON.stringify(ch.summary || ''),
      '---', ''];
    const body = scenes.map(s => {
      const meta = { id: s.id, order: s.order || 0, title: s.title || '', pov: s.pov || '', placeId: s.placeId || '', time: s.time || '', summary: s.summary || '' };
      return `<!-- scene: ${inlineJSON(meta)} -->\n## ${(s.title || '제목 없는 장면').replace(/\n/g, ' ')}\n\n${(s.content || '').replace(/\s+$/, '')}\n`;
    });
    return fm.join('\n') + '\n# ' + (ch.title || '제목 없는 장').replace(/\n/g, ' ') + '\n\n' + body.join('\n');
  }

  function markdownToChapter(text, fallbackId) {
    text = String(text).replace(/\r\n/g, '\n');
    const ch = { id: fallbackId, order: 0, title: '', summary: '' };
    let rest = text;
    const fm = text.match(/^---\n([\s\S]*?)\n---\n?/);
    if (fm) {
      fm[1].split('\n').forEach(line => {
        const m = line.match(/^(\w+):\s?(.*)$/);
        if (!m) return;
        let v = m[2];
        try { v = JSON.parse(v); } catch (e) { /* 손으로 고친 값은 그대로 쓴다 */ }
        ch[m[1]] = v;
      });
      rest = text.slice(fm[0].length);
    }
    const scenes = [];
    const re = /<!-- scene: (\{.*?\}) -->\n?/g;
    const marks = [];
    let m;
    while ((m = re.exec(rest))) marks.push({ at: m.index, end: re.lastIndex, json: m[1] });
    marks.forEach((mk, i) => {
      let meta = {};
      try { meta = JSON.parse(mk.json); } catch (e) {}
      let content = rest.slice(mk.end, i + 1 < marks.length ? marks[i + 1].at : rest.length);
      content = content.replace(/^## [^\n]*\n/, '').replace(/^\n+/, '').replace(/\s+$/, '');
      scenes.push(Object.assign({ id: meta.id || (ch.id + '_s' + (i + 1)), order: i + 1, title: '', pov: '', placeId: '', time: '', summary: '' }, meta, { chapterId: ch.id, content }));
    });
    ch.order = Number(ch.order) || 0;
    return { chapter: ch, scenes };
  }

  /** 작품 상태 → { 경로: 파일 내용 } */
  function toFiles(S) {
    const f = {};
    const meta = Object.assign({}, S.meta);
    f['project.json'] = pretty(Object.assign({ format: FORMAT, version: VERSION }, meta));
    const chs = S.chapters.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    chs.forEach(ch => {
      const sc = S.scenes.filter(s => s.chapterId === ch.id).sort((a, b) => (a.order || 0) - (b.order || 0));
      f['manuscript/' + safeName(ch.id) + '.md'] = chapterToMarkdown(ch, sc);
    });
    S.characters.forEach(c => { f['characters/' + safeName(c.id) + '.json'] = pretty(c); });
    f['characters/_relationships.json'] = pretty(S.relations);
    f['world/lore.json'] = pretty(S.lore);
    f['places/places.json'] = pretty(S.places);
    f['timeline/events.json'] = pretty(S.events);
    f['foreshadowing/clues.json'] = pretty(S.clues);
    f['items/items.json'] = pretty(S.items);
    f['ai/style_profile.json'] = pretty(S.style);
    f['ai/issues.json'] = pretty(S.issues);
    f['ai/plans.json'] = pretty(S.plans || []);
    return f;
  }

  /** { 경로: 파일 내용 } → 작품 상태. 형식이 아니면 오류를 던진다. */
  function fromFiles(files) {
    if (!files['project.json']) throw new Error('이 폴더에 project.json이 없습니다. StoryForge 작품 폴더가 아닙니다.');
    const S = emptyState();
    const j = (p, d) => { if (!files[p]) return d; try { return JSON.parse(files[p]); } catch (e) { throw new Error(p + ' 파일의 JSON 형식이 잘못되었습니다: ' + e.message); } };
    const meta = j('project.json', {});
    delete meta.format; delete meta.version;
    Object.assign(S.meta, meta);
    Object.keys(files).filter(p => /^manuscript\/.+\.md$/.test(p)).forEach(p => {
      const id = p.replace(/^manuscript\//, '').replace(/\.md$/, '');
      const { chapter, scenes } = markdownToChapter(files[p], id);
      S.chapters.push(chapter);
      S.scenes.push(...scenes);
    });
    Object.keys(files).filter(p => /^characters\/[^_][^/]*\.json$/.test(p)).forEach(p => S.characters.push(j(p)));
    S.relations = j('characters/_relationships.json', []);
    S.lore = j('world/lore.json', []);
    S.places = j('places/places.json', []);
    S.events = j('timeline/events.json', []);
    S.clues = j('foreshadowing/clues.json', []);
    S.items = j('items/items.json', []);
    S.style = Object.assign(S.style, j('ai/style_profile.json', {}));
    S.issues = j('ai/issues.json', []);
    S.plans = j('ai/plans.json', []);
    S.meta.dismissed = S.meta.dismissed || [];
    return S;
  }

  const isManaged = rel => MANAGED.some(m => m.endsWith('/') ? rel.startsWith(m) : rel === m);

  const api = { FORMAT, VERSION, emptyState, toFiles, fromFiles, chapterToMarkdown, markdownToChapter, isManaged };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SFFormat = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/github.js */
/*
 * GitHub 저장소 연결
 *
 * 브라우저에서 GitHub REST API를 직접 부릅니다. 서버가 필요 없어서
 * GitHub Pages 같은 정적 호스팅에 그대로 올릴 수 있습니다.
 *
 * 커밋은 Git Data API로 한 번에 만듭니다(파일 여러 개 = 커밋 하나).
 * 바뀌지 않은 파일은 git blob SHA를 비교해 건너뜁니다.
 */
(function (root) {
  'use strict';
  const F = root.SFFormat || (typeof require !== 'undefined' ? require('./format.js') : null);

  class GitHubError extends Error {
    constructor(status, message) { super(message); this.status = status; }
  }

  function friendly(e) {
    if (!(e instanceof GitHubError)) return (e && e.message) || '알 수 없는 오류가 났습니다.';
    if (e.status === 401) return '토큰이 올바르지 않거나 만료되었습니다. 작품 설정에서 토큰을 다시 넣어 주세요.';
    if (e.status === 403) return /rate limit/i.test(e.message) ? 'GitHub API 사용 한도에 걸렸습니다. 잠시 뒤에 다시 시도하세요.' : '이 저장소에 쓸 권한이 없습니다. 토큰에 Contents 읽기·쓰기 권한이 있는지 확인하세요.';
    if (e.status === 404) return '저장소를 찾지 못했습니다. 소유자와 저장소 이름, 그리고 토큰이 이 저장소에 접근할 수 있는지 확인하세요.';
    if (e.status === 409) return '저장소가 비어 있거나 다른 변경과 충돌했습니다. 다시 시도해 주세요.';
    if (e.status === 422) return 'GitHub가 요청을 받아들이지 않았습니다: ' + e.message;
    if (!e.status) return 'GitHub에 연결하지 못했습니다. 인터넷 연결을 확인하세요.';
    return 'GitHub 오류 (' + e.status + '): ' + e.message;
  }

  const enc = new TextEncoder();
  const dec = new TextDecoder();

  async function sha1Hex(bytes) {
    const subtle = (root.crypto && root.crypto.subtle) || (typeof require !== 'undefined' ? require('crypto').webcrypto.subtle : null);
    const buf = await subtle.digest('SHA-1', bytes);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  /** git이 파일 내용에 매기는 SHA ("blob <길이>\0<내용>") */
  async function blobSha(text) {
    const body = enc.encode(text);
    const head = enc.encode('blob ' + body.length + '\0');
    const all = new Uint8Array(head.length + body.length);
    all.set(head); all.set(body, head.length);
    return sha1Hex(all);
  }
  function b64decodeUtf8(b64) {
    const bin = (root.atob || (s => Buffer.from(s, 'base64').toString('binary')))(b64.replace(/\n/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return dec.decode(bytes);
  }
  function b64encodeUtf8(text) {
    const bytes = enc.encode(text);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return (root.btoa || (s => Buffer.from(s, 'binary').toString('base64')))(bin);
  }

  class GitHubStore {
    /** cfg: {owner, repo, branch, dir, token} — dir은 저장소 안의 작품 폴더 ('' = 저장소 맨 위) */
    constructor(cfg, fetchImpl) {
      this.cfg = Object.assign({ branch: 'main', dir: '' }, cfg);
      this.cfg.dir = String(this.cfg.dir || '').replace(/^\/+|\/+$/g, '');
      this.fetch = fetchImpl || root.fetch.bind(root);
    }
    get prefix() { return this.cfg.dir ? this.cfg.dir + '/' : ''; }
    get base() { return `/repos/${encodeURIComponent(this.cfg.owner)}/${encodeURIComponent(this.cfg.repo)}`; }

    async api(path, opts = {}) {
      let res;
      try {
        res = await this.fetch('https://api.github.com' + path, {
          method: opts.method || 'GET',
          headers: Object.assign({
            'Accept': 'application/vnd.github+json',
            'Authorization': 'Bearer ' + this.cfg.token,
            'X-GitHub-Api-Version': '2022-11-28'
          }, opts.body ? { 'Content-Type': 'application/json' } : {}),
          body: opts.body ? JSON.stringify(opts.body) : undefined,
          cache: 'no-store'
        });
      } catch (e) { throw new GitHubError(0, e.message); }
      if (!res.ok) {
        let msg = res.statusText;
        try { msg = (await res.json()).message || msg; } catch (e) {}
        throw new GitHubError(res.status, msg);
      }
      return res.status === 204 ? null : res.json();
    }

    /** 저장소 정보와 쓰기 권한 확인 */
    async check() {
      const r = await this.api(this.base);
      return { fullName: r.full_name, private: r.private, defaultBranch: r.default_branch, canPush: !!(r.permissions && r.permissions.push), htmlUrl: r.html_url };
    }

    async headSha(branch = this.cfg.branch) {
      try {
        const ref = await this.api(`${this.base}/git/ref/heads/${encodeURIComponent(branch)}`);
        return ref.object.sha;
      } catch (e) {
        if (e.status === 404 || e.status === 409) return null;
        throw e;
      }
    }

    /** 커밋 하나의 작품 폴더 안 파일 목록: { 상대경로: blobSha } */
    async listFiles(commitSha) {
      const c = await this.api(`${this.base}/git/commits/${commitSha}`);
      const t = await this.api(`${this.base}/git/trees/${c.tree.sha}?recursive=1`);
      if (t.truncated) throw new GitHubError(0, '저장소 파일이 너무 많아 목록을 다 읽지 못했습니다. 작품 폴더를 따로 지정해 주세요.');
      const out = {};
      t.tree.forEach(n => {
        if (n.type !== 'blob' || !n.path.startsWith(this.prefix)) return;
        const rel = n.path.slice(this.prefix.length);
        if (F.isManaged(rel)) out[rel] = n.sha;
      });
      return out;
    }

    /** 커밋 하나에서 작품을 읽는다. 반환: {sha, files:{rel: text}, shas:{rel: blobSha}} */
    async load(commitSha) {
      const sha = commitSha || await this.headSha();
      if (!sha) return null;
      const shas = await this.listFiles(sha);
      const files = {};
      const paths = Object.keys(shas);
      for (let i = 0; i < paths.length; i += 8) {
        await Promise.all(paths.slice(i, i + 8).map(async p => {
          const b = await this.api(`${this.base}/git/blobs/${shas[p]}`);
          files[p] = b.encoding === 'base64' ? b64decodeUtf8(b.content) : b.content;
        }));
      }
      return { sha, files, shas };
    }

    /** 브랜치가 없으면 만든다. 저장소가 완전히 비어 있으면 첫 파일을 올려 브랜치를 만든다. */
    async ensureBranch() {
      let head = await this.headSha();
      if (head) return head;
      const info = await this.check();
      const def = await this.headSha(info.defaultBranch);
      if (def) {
        await this.api(`${this.base}/git/refs`, { method: 'POST', body: { ref: 'refs/heads/' + this.cfg.branch, sha: def } });
        return def;
      }
      // 빈 저장소: Contents API로 첫 커밋을 만든다
      await this.api(`${this.base}/contents/${this.prefix}README.md`.replace(/\/\//g, '/'), {
        method: 'PUT',
        body: { message: 'StoryForge 작품 폴더 만들기', content: b64encodeUtf8('# StoryForge 작품\n\n이 폴더는 StoryForge가 관리합니다. 원고는 manuscript/ 폴더의 Markdown 파일에 있습니다.\n') }
      });
      head = await this.headSha(info.defaultBranch);
      if (info.defaultBranch !== this.cfg.branch) {
        await this.api(`${this.base}/git/refs`, { method: 'POST', body: { ref: 'refs/heads/' + this.cfg.branch, sha: head } });
      }
      return head;
    }

    /**
     * 작품 전체를 커밋한다.
     * files: {rel: text} (작품 폴더 기준). 폴더 안에서 사라진 관리 파일은 지운다.
     * expectedHead를 주면, 원격 브랜치가 그 사이 바뀌었을 때 커밋하지 않고 {conflict:true}를 돌려준다.
     */
    async commit(files, message, { expectedHead } = {}) {
      const head = await this.ensureBranch();
      if (expectedHead && head !== expectedHead) return { conflict: true, remoteHead: head };
      const remote = await this.listFiles(head);
      const entries = [];
      const newShas = {};
      for (const [rel, text] of Object.entries(files)) {
        const sha = await blobSha(text);
        newShas[rel] = sha;
        if (remote[rel] !== sha) entries.push({ path: this.prefix + rel, mode: '100644', type: 'blob', content: text });
      }
      Object.keys(remote).forEach(rel => {
        if (!(rel in files)) entries.push({ path: this.prefix + rel, mode: '100644', type: 'blob', sha: null });
      });
      if (!entries.length) return { unchanged: true, sha: head, shas: newShas };
      const parent = await this.api(`${this.base}/git/commits/${head}`);
      const tree = await this.api(`${this.base}/git/trees`, { method: 'POST', body: { base_tree: parent.tree.sha, tree: entries } });
      const c = await this.api(`${this.base}/git/commits`, { method: 'POST', body: { message, tree: tree.sha, parents: [head] } });
      try {
        await this.api(`${this.base}/git/refs/heads/${encodeURIComponent(this.cfg.branch)}`, { method: 'PATCH', body: { sha: c.sha, force: false } });
      } catch (e) {
        if (e.status === 422 || e.status === 409) return { conflict: true, remoteHead: await this.headSha() };
        throw e;
      }
      return { sha: c.sha, shas: newShas, changed: entries.length, url: c.html_url };
    }

    /** 작품 폴더의 커밋 기록 */
    async history(limit = 30) {
      const q = `?sha=${encodeURIComponent(this.cfg.branch)}&per_page=${limit}` + (this.cfg.dir ? '&path=' + encodeURIComponent(this.cfg.dir) : '');
      try {
        const list = await this.api(`${this.base}/commits${q}`);
        return list.map(c => ({ sha: c.sha, message: c.commit.message, date: c.commit.author && c.commit.author.date, author: (c.author && c.author.login) || (c.commit.author && c.commit.author.name), url: c.html_url }));
      } catch (e) {
        if (e.status === 409 || e.status === 404) return [];
        throw e;
      }
    }

    webUrl(path = '') {
      return `https://github.com/${this.cfg.owner}/${this.cfg.repo}/tree/${this.cfg.branch}/${this.prefix}${path}`.replace(/\/$/, '');
    }
  }

  const api = { GitHubStore, GitHubError, friendly, blobSha };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SFGitHub = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* js/ai.js */
/*
 * AI 편집자 — 여러 AI 제공자를 같은 방식으로 부릅니다.
 *
 *   anthropic   Claude (Anthropic Messages API)
 *   openai      ChatGPT (OpenAI Responses API)
 *   gemini      Gemini (Google Gemini API)
 *   openrouter  OpenRouter (여러 회사 모델을 키 하나로)
 *   custom      OpenAI 호환 주소 (DeepSeek, Groq, Mistral, 로컬 Ollama·LM Studio 등)
 *
 * 모든 요청은 브라우저에서 각 회사 API로 바로 갑니다. 키는 이 브라우저의
 * localStorage에만 저장되고, 해당 제공자 주소 외에는 보내지 않습니다.
 */
(function (root) {
  'use strict';

  /* 모델 이름은 자주 바뀝니다. 아래는 입력 칸의 제안일 뿐이고,
     설정 화면의 「모델 목록 불러오기」로 내 키에서 쓸 수 있는 실제 목록을 받을 수 있습니다. */
  const PROVIDERS = {
    anthropic: { label: 'Claude (Anthropic)', keyUrl: 'https://console.anthropic.com/settings/keys', keyHint: 'sk-ant-…',
      models: ['claude-sonnet-5', 'claude-opus-5-5', 'claude-haiku-4-5-20251001'] },
    openai: { label: 'ChatGPT (OpenAI)', keyUrl: 'https://platform.openai.com/api-keys', keyHint: 'sk-…',
      models: ['gpt-6-sol', 'gpt-6-astra', 'gpt-6-luna'] },
    gemini: { label: 'Gemini (Google)', keyUrl: 'https://aistudio.google.com/apikey', keyHint: 'AIza…',
      models: ['gemini-3.8-flash', 'gemini-3.1-pro-preview', 'gemini-3.5-flash-lite'] },
    openrouter: { label: 'OpenRouter (여러 모델)', keyUrl: 'https://openrouter.ai/keys', keyHint: 'sk-or-…',
      models: [] },
    custom: { label: 'OpenAI 호환 주소 (DeepSeek · Groq · Ollama 등)', keyUrl: '', keyHint: '필요한 경우만',
      models: [], needsBaseUrl: true,
      baseUrlExamples: ['https://api.deepseek.com/v1', 'https://api.groq.com/openai/v1', 'https://api.mistral.ai/v1', 'http://localhost:11434/v1'] }
  };

  class AIError extends Error {
    constructor(code, message, text) { super(message); this.code = code; this.text = text; }
  }

  function friendly(e) {
    const c = e && e.code;
    return ({
      no_key: 'AI를 쓰려면 작품 설정에서 AI 제공자와 API 키를 넣어 주세요.',
      no_model: '작품 설정에서 모델 이름을 넣거나 「모델 목록 불러오기」로 골라 주세요.',
      no_base: '작품 설정에서 API 주소를 넣어 주세요.',
      auth: 'API 키가 올바르지 않습니다. 작품 설정에서 키를 확인하세요.',
      permission: '이 키로는 선택한 모델을 쓸 수 없거나 모델 이름이 틀렸습니다. 「모델 목록 불러오기」로 다시 골라 보세요.',
      rate_limited: '요청이 너무 많거나 사용 한도에 걸렸습니다. 잠시 뒤에 다시 눌러 주세요.',
      overloaded: 'AI 서버가 붐빕니다. 잠시 뒤에 다시 눌러 주세요.',
      too_large: 'AI에게 보낼 내용이 너무 깁니다. 선택 범위나 장면을 줄여 주세요.',
      invalid_json: 'AI 응답 형식이 맞지 않았습니다. 다시 눌러 주세요.',
      cancelled: '중단했습니다.',
      network: 'AI 서버에 연결하지 못했습니다. 인터넷 연결을 확인하세요. OpenAI 호환 주소라면 그 서버가 브라우저 요청(CORS)을 허용하는지도 확인하세요.',
      empty: 'AI가 빈 답을 보냈습니다. 최대 길이가 부족했을 수 있습니다. 다시 시도하거나 다른 모델을 골라 보세요.',
      bad_request: 'AI 요청이 거절되었습니다: ' + (e && e.message)
    })[c] || ('AI 응답을 받지 못했습니다. ' + ((e && e.message) || ''));
  }

  function codeForStatus(status, msg) {
    if (status === 400) return /too long|too many tokens|context length|maximum context|exceeds/i.test(msg) ? 'too_large' : /model/i.test(msg) && /not|invalid|exist/i.test(msg) ? 'permission' : 'bad_request';
    return { 401: 'auth', 403: 'permission', 404: 'permission', 413: 'too_large', 429: 'rate_limited', 500: 'overloaded', 502: 'overloaded', 503: 'overloaded', 529: 'overloaded' }[status] || 'server';
  }

  /* ---------- SSE 읽기 ---------- */
  async function readSSE(res, onEvent) {
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).replace(/\r$/, '');
        buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (!data || data === '[DONE]') continue;
        let ev;
        try { ev = JSON.parse(data); } catch (e) { continue; }
        onEvent(ev);
      }
    }
  }

  /* ---------- 제공자별 요청과 스트림 해석 ---------- */
  const ADAPTERS = {
    anthropic: {
      request: (c, prompt, max) => ({
        url: 'https://api.anthropic.com/v1/messages',
        headers: { 'content-type': 'application/json', 'x-api-key': c.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: { model: c.model, max_tokens: max, stream: true, messages: [{ role: 'user', content: prompt }] }
      }),
      event: (ev, st) => {
        if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') st.add(ev.delta.text);
        else if (ev.type === 'message_delta' && ev.delta && ev.delta.stop_reason === 'max_tokens') st.truncated = true;
        else if (ev.type === 'error') st.fail(ev.error && ev.error.type === 'overloaded_error' ? 'overloaded' : ev.error && ev.error.type === 'rate_limit_error' ? 'rate_limited' : 'server', ev.error && ev.error.message);
      },
      errMsg: j => j && j.error && j.error.message,
      models: async c => {
        const j = await getJSON('https://api.anthropic.com/v1/models?limit=100', { 'x-api-key': c.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' });
        return (j.data || []).map(m => m.id);
      }
    },
    openai: {
      request: (c, prompt, max) => ({
        url: 'https://api.openai.com/v1/responses',
        headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + c.key },
        body: { model: c.model, input: prompt, max_output_tokens: max, stream: true }
      }),
      event: (ev, st) => {
        if (ev.type === 'response.output_text.delta' && typeof ev.delta === 'string') st.add(ev.delta);
        else if (ev.type === 'response.incomplete') st.truncated = true;
        else if (ev.type === 'response.failed') st.fail('server', ev.response && ev.response.error && ev.response.error.message);
        else if (ev.type === 'error') st.fail(/rate/i.test(ev.code || ev.message || '') ? 'rate_limited' : 'server', ev.message);
      },
      errMsg: j => j && j.error && j.error.message,
      models: async c => {
        const j = await getJSON('https://api.openai.com/v1/models', { authorization: 'Bearer ' + c.key });
        return (j.data || []).map(m => m.id).filter(id => /^(gpt|o\d|chatgpt)/i.test(id) && !/(audio|realtime|transcribe|tts|image|embedding|search|moderation|whisper|dall)/i.test(id)).sort();
      }
    },
    gemini: {
      request: (c, prompt, max) => ({
        url: `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model.replace(/^models\//, ''))}:streamGenerateContent?alt=sse`,
        headers: { 'content-type': 'application/json', 'x-goog-api-key': c.key },
        body: { contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { maxOutputTokens: max } }
      }),
      event: (ev, st) => {
        if (ev.error) return st.fail(ev.error.code === 429 ? 'rate_limited' : 'server', ev.error.message);
        const cand = ev.candidates && ev.candidates[0];
        if (!cand) { if (ev.promptFeedback && ev.promptFeedback.blockReason) st.fail('bad_request', '안전 필터에 걸렸습니다 (' + ev.promptFeedback.blockReason + ')'); return; }
        ((cand.content && cand.content.parts) || []).forEach(p => { if (p.text && !p.thought) st.add(p.text); });
        if (cand.finishReason === 'MAX_TOKENS') st.truncated = true;
      },
      errMsg: j => (Array.isArray(j) ? j[0] : j) && ((Array.isArray(j) ? j[0] : j).error || {}).message,
      models: async c => {
        const j = await getJSON('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { 'x-goog-api-key': c.key });
        return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini/i.test(m.name) && !/(embedding|tts|image|audio|live)/i.test(m.name)).map(m => m.name.replace(/^models\//, ''));
      }
    },
    openrouter: {
      request: (c, prompt, max) => chatRequest('https://openrouter.ai/api/v1', c, prompt, max, { 'HTTP-Referer': (root.location && root.location.origin) || 'https://storyforge.local', 'X-Title': 'StoryForge' }),
      event: chatEvent,
      errMsg: j => j && j.error && j.error.message,
      models: async c => {
        const j = await getJSON('https://openrouter.ai/api/v1/models', c.key ? { authorization: 'Bearer ' + c.key } : {});
        return (j.data || []).map(m => m.id).sort();
      }
    },
    custom: {
      request: (c, prompt, max) => chatRequest(c.baseUrl, c, prompt, max, {}),
      event: chatEvent,
      errMsg: j => j && ((j.error && (j.error.message || j.error)) || j.message),
      models: async c => {
        const j = await getJSON(String(c.baseUrl).replace(/\/+$/, '') + '/models', c.key ? { authorization: 'Bearer ' + c.key } : {});
        return (j.data || j.models || []).map(m => m.id || m.name).filter(Boolean).sort();
      }
    }
  };
  function chatRequest(baseUrl, c, prompt, max, extra) {
    return {
      url: String(baseUrl || '').replace(/\/+$/, '') + '/chat/completions',
      headers: Object.assign({ 'content-type': 'application/json' }, c.key ? { authorization: 'Bearer ' + c.key } : {}, extra),
      body: { model: c.model, max_tokens: max, stream: true, messages: [{ role: 'user', content: prompt }] }
    };
  }
  function chatEvent(ev, st) {
    if (ev.error) return st.fail('server', ev.error.message || String(ev.error));
    const ch = ev.choices && ev.choices[0];
    if (!ch) return;
    if (ch.delta && typeof ch.delta.content === 'string') st.add(ch.delta.content);
    if (ch.finish_reason === 'length') st.truncated = true;
  }
  async function getJSON(url, headers) {
    let res;
    try { res = await fetch(url, { headers }); } catch (e) { throw new AIError('network', e.message); }
    let j = null; try { j = await res.json(); } catch (e) {}
    if (!res.ok) throw new AIError(codeForStatus(res.status, ''), (j && j.error && (j.error.message || j.error)) || res.statusText);
    return j || {};
  }

  class AIClient {
    /** cfg: {provider, key, model, baseUrl} */
    constructor(cfg) { this.cfg = Object.assign({ provider: 'anthropic', key: '', model: '', baseUrl: '' }, cfg); }
    get provider() { return this.cfg.provider; }
    get label() { return (PROVIDERS[this.cfg.provider] || {}).label || this.cfg.provider; }
    get ready() {
      const c = this.cfg, p = PROVIDERS[c.provider];
      if (!p || !c.model) return false;
      if (p.needsBaseUrl) return !!c.baseUrl;
      return !!c.key;
    }
    missing() {
      const c = this.cfg, p = PROVIDERS[c.provider] || {};
      if (p.needsBaseUrl && !c.baseUrl) return 'no_base';
      if (!p.needsBaseUrl && !c.key) return 'no_key';
      if (!c.model) return 'no_model';
      return null;
    }

    /** 프롬프트 하나를 보내고 답을 스트리밍으로 받는다. onText({text}) = 지금까지의 전체 답 */
    async ask(prompt, { onText, signal, maxTokens = 8192 } = {}) {
      const miss = this.missing();
      if (miss) throw new AIError(miss, miss);
      const ad = ADAPTERS[this.cfg.provider];
      const req = ad.request(this.cfg, prompt, maxTokens);
      let res;
      try {
        res = await fetch(req.url, { method: 'POST', signal, headers: req.headers, body: JSON.stringify(req.body) });
      } catch (e) {
        if (e && e.name === 'AbortError') throw new AIError('cancelled', 'cancelled');
        throw new AIError('network', e.message);
      }
      if (!res.ok) {
        let msg = res.statusText;
        try { msg = ad.errMsg(await res.json()) || msg; } catch (e) {}
        throw new AIError(codeForStatus(res.status, msg), msg);
      }
      const st = {
        text: '', truncated: false, err: null,
        add(t) { this.text += t; if (onText) { try { onText({ text: this.text }); } catch (e) {} } },
        fail(code, message) { if (!this.err) this.err = new AIError(code, message || code, this.text); }
      };
      try {
        await readSSE(res, ev => { if (!st.err) ad.event(ev, st); });
      } catch (e) {
        if (e && e.name === 'AbortError') throw new AIError('cancelled', 'cancelled', st.text);
        throw new AIError('network', e.message, st.text);
      }
      if (st.err) throw st.err;
      if (!st.text.trim()) throw new AIError('empty', 'empty');
      return { text: st.text, truncated: st.truncated };
    }

    /** JSON으로 답을 받는다. 코드 블록이나 앞뒤 문장이 섞여도 첫 JSON 값을 꺼낸다. */
    async json(prompt, opts = {}) {
      const { text } = await this.ask(prompt + '\n\n다른 설명 없이 JSON 값 하나만 출력하라.', opts);
      const v = extractJSON(text);
      if (v === undefined) throw new AIError('invalid_json', 'invalid json', text);
      return v;
    }

    /** 이 키로 쓸 수 있는 모델 목록 */
    async listModels() {
      const p = PROVIDERS[this.cfg.provider] || {};
      if (p.needsBaseUrl && !this.cfg.baseUrl) throw new AIError('no_base', 'no base');
      if (!p.needsBaseUrl && this.cfg.provider !== 'openrouter' && !this.cfg.key) throw new AIError('no_key', 'no key');
      return ADAPTERS[this.cfg.provider].models(this.cfg);
    }
  }

  function extractJSON(text) {
    const tryParse = s => { try { return { ok: true, v: JSON.parse(s) }; } catch (e) { return { ok: false }; } };
    let r = tryParse(text.trim());
    if (!r.ok) { const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (m) r = tryParse(m[1].trim()); }
    if (!r.ok) {
      const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf(']'), text.lastIndexOf('}'));
      if (a >= 0 && b > a) r = tryParse(text.slice(a, b + 1));
    }
    return r.ok ? r.v : undefined;
  }

  const api = { AIClient, AIError, friendly, PROVIDERS, extractJSON };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SFAI = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

/* ---------- GitHub ---------- */
let GH = Object.assign({owner:'', repo:'', branch:'main', dir:'', token:'', auto:false}, lsGet(LS_GH, {}));
let base = lsGet(LS_BASE, null);          // {key, sha, shas} 마지막으로 맞춘 커밋
const git = {busy:null, msg:'', err:'', info:null, changes:null, history:null, conflict:null, loadedFrom:null, remoteState:null};
const ghKey = () => `${GH.owner}/${GH.repo}@${GH.branch}:${String(GH.dir || '').replace(/^\/+|\/+$/g, '')}`;
const ghReady = () => !!(GH.owner && GH.repo && GH.token);
const baseValid = () => !!(base && base.key === ghKey());
const store = () => new SFGitHub.GitHubStore(GH);
function saveGH(){ lsSet(LS_GH, GH); }
function setBase(b){ base = b; lsSet(LS_BASE, b); }

let chT = null;
function scheduleChanges(){ clearTimeout(chT); chT = setTimeout(computeChanges, 1200); }
async function computeChanges(){
  if (!ghReady()){ git.changes = null; renderTop(); return; }
  const files = SFFormat.toFiles(S);
  const old = baseValid() ? base.shas : {};
  const out = [];
  for (const [p, t] of Object.entries(files)){
    const sha = await SFGitHub.blobSha(t);
    if (!(p in old)) out.push({path:p, kind:'a'});
    else if (old[p] !== sha) out.push({path:p, kind:'m'});
  }
  Object.keys(old).forEach(p => { if (!(p in files)) out.push({path:p, kind:'r'}); });
  git.changes = out;
  renderTop();
  if (UI.view === 'git') renderGitBody();
}
function pathLabel(p){
  let m;
  if ((m = p.match(/^manuscript\/(.+)\.md$/))){ const c = S.chapters.find(x => x.id === m[1]); return c ? `제${chNum(c.id)}장 원고` : '원고'; }
  if ((m = p.match(/^characters\/([^_].*)\.json$/))){ const c = S.characters.find(x => x.id === m[1]); return c ? `인물 · ${c.name}` : '인물'; }
  return ({'characters/_relationships.json':'관계도','world/lore.json':'세계관','places/places.json':'장소','timeline/events.json':'연표','foreshadowing/clues.json':'복선','items/items.json':'아이템','ai/style_profile.json':'문체 프로필','ai/issues.json':'AI 편집 메모','ai/plans.json':'전개 구상','project.json':'작품 정보'})[p] || p;
}
function suggestMsg(){
  const ch = git.changes || [];
  if (git.loadedFrom) return `이전 버전(${git.loadedFrom.slice(0, 7)})으로 되돌리기`;
  if (!baseValid()) return `「${S.meta.title}」 올리기`;
  const labels = [...new Set(ch.map(c => pathLabel(c.path).replace(/ · .*/, '') + (c.kind === 'a' ? ' 추가' : c.kind === 'r' ? ' 삭제' : ' 수정')))];
  return labels.slice(0, 3).join(', ') + (labels.length > 3 ? ` 외 ${labels.length - 3}건` : '') || '작품 수정';
}

async function ghCheck(){
  if (!ghReady()){ git.err = '소유자, 저장소 이름, 토큰을 모두 넣어 주세요.'; renderMain(); return; }
  git.busy = 'check'; git.err = ''; git.msg = ''; git.info = null; git.remoteState = null; renderMain();
  try {
    const st = store();
    const info = await st.check();
    git.info = info;
    if (!info.canPush) git.err = '이 토큰으로는 저장소를 읽을 수만 있습니다. 토큰에 Contents 읽기·쓰기 권한을 주세요.';
    const head = await st.headSha();
    if (!head) git.remoteState = 'empty';
    else { const files = await st.listFiles(head); git.remoteState = files['project.json'] ? 'project' : 'empty'; }
  } catch(e){ git.err = SFGitHub.friendly(e); }
  git.busy = null; renderMain(); computeChanges();
}
async function ghPull(sha){
  if (!ghReady()) return;
  git.busy = 'pull'; git.err = ''; git.msg = ''; renderGitUI();
  try {
    const st = store();
    const r = await st.load(sha);
    if (!r || !r.files['project.json']){
      git.err = '이 저장소 폴더에는 아직 StoryForge 작품이 없습니다. 지금 작품을 커밋하면 이 폴더에 저장됩니다.';
    } else {
      const ns = SFFormat.fromFiles(r.files);
      if (sha){
        const head = await st.headSha();
        setBase({key: ghKey(), sha: head, shas: await st.listFiles(head)});
        git.loadedFrom = sha;
        git.msg = `${sha.slice(0, 7)} 버전을 불러왔습니다. 이 상태를 최신으로 삼으려면 커밋하세요.`;
      } else {
        setBase({key: ghKey(), sha: r.sha, shas: r.shas});
        git.loadedFrom = null;
        git.msg = 'GitHub에서 최신 버전을 불러왔습니다.';
      }
      git.conflict = null;
      replaceState(ns);
      renderSide(); renderAI(); renderStatus();
    }
  } catch(e){ git.err = SFGitHub.friendly(e); }
  git.busy = null; await computeChanges(); renderGitUI();
}
async function ghCommit(force, auto){
  if (!ghReady()){ UI.view = 'settings'; renderSide(); renderMain(); return; }
  const input = $('#commit-msg');
  const message = auto ? '자동 저장: ' + suggestMsg() : ((input && input.value.trim()) || suggestMsg());
  git.busy = 'commit'; git.err = ''; git.msg = ''; renderGitUI();
  try {
    const st = store();
    if (!baseValid() && !force){
      const head = await st.headSha();
      if (head){ const files = await st.listFiles(head); if (files['project.json']){ git.conflict = {remoteHead: head, first: true}; throw null; } }
    }
    const r = await st.commit(SFFormat.toFiles(S), message, {expectedHead: force ? undefined : (baseValid() ? base.sha : undefined)});
    if (r.conflict){ git.conflict = {remoteHead: r.remoteHead}; }
    else {
      setBase({key: ghKey(), sha: r.sha, shas: r.shas});
      git.conflict = null; git.loadedFrom = null;
      git.msg = r.unchanged ? '바뀐 내용이 없어 커밋하지 않았습니다.' : `커밋했습니다 · 파일 ${r.changed}개 · ${r.sha.slice(0, 7)}`;
      if (input) input.value = '';
      if (!r.unchanged){ git.history = null; loadHistory(); }
    }
  } catch(e){ if (e) git.err = SFGitHub.friendly(e); }
  git.busy = null; await computeChanges(); renderGitUI();
}
async function loadHistory(){
  if (!ghReady()) return;
  try { git.history = await store().history(30); } catch(e){ git.history = []; git.err = SFGitHub.friendly(e); }
  if (UI.view === 'git') renderGitBody();
}
setInterval(() => {
  if (GH.auto && ghReady() && !git.busy && !git.conflict && git.changes && git.changes.length && baseValid()) ghCommit(false, true);
}, 10 * 60 * 1000);

/* ---------- local checks (no AI) ---------- */
function hash(s){ let x = 0; for (let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) | 0; return (x >>> 0).toString(36); }
function sentences(t){ return String(t || '').split(/(?<=[.!?…。])\s+|\n+/).map(s => s.trim()).filter(Boolean); }
function lintScene(sc){
  const out = []; const sents = sentences(sc.content);
  S.characters.forEach(c => {
    const age = parseInt(c.age, 10); if (!age || !c.name) return;
    const names = [c.name, ...String(c.aliases || '').split(/[,、]/)].map(s => s.trim()).filter(s => s.length >= 2);
    sents.forEach(s => {
      if (!names.some(n => s.includes(n))) return;
      const m = s.match(/(\d{1,5})\s*(세|살)/);
      if (m && Number(m[1]) !== age){
        out.push({id:'L' + hash(sc.id + c.id + s), local:true, sceneId:sc.id, type:'conflict', quote:s.slice(0, 140),
          message:`본문은 ${c.name}의 나이를 ${m[1]}${m[2]}로 말하지만, 인물 DB에는 "${c.age}"로 적혀 있습니다. 의도한 차이라면 무시하세요.`, basis:`인물 DB · ${c.name} · 나이`});
      }
    });
  });
  String(S.style.forbidden || '').split(/[,\n]/).map(s => s.trim()).filter(Boolean).forEach(w => {
    const n = (sc.content || '').split(w).length - 1;
    if (n) out.push({id:'L' + hash(sc.id + 'f' + w), local:true, sceneId:sc.id, type:'style', quote:w, message:`금지어 "${w}"가 이 장면에 ${n}번 나옵니다.`, basis:'문체 프로필 · 금지어'});
  });
  return out.filter(i => !S.meta.dismissed.includes(i.id));
}
function relintAll(){ localIssues = {}; S.scenes.forEach(s => localIssues[s.id] = lintScene(s)); }
let lintT = null;
function scheduleLint(id){ clearTimeout(lintT); lintT = setTimeout(() => { const s = byId('scenes', id); if (s){ localIssues[id] = lintScene(s); renderAI(); renderStatus(); renderSide(); } }, 700); }
function allIssues(){ return [...S.issues, ...Object.values(localIssues).flat()].filter(i => byId('scenes', i.sceneId)); }

function gitButton(){
  if (!ghReady()) return `<button class="gitbtn" data-a="view" data-v="settings"><i class="d"></i>GitHub 연결</button>`;
  const n = git.changes ? git.changes.length : null;
  let cls = 'ok', t = 'GitHub · 최신';
  if (git.conflict || git.err){ cls = 'err'; t = git.conflict ? 'GitHub · 충돌' : 'GitHub · 오류'; }
  else if (git.busy === 'commit') { cls = 'dirty'; t = '커밋 중…'; }
  else if (!baseValid()){ cls = 'dirty'; t = 'GitHub · 첫 커밋 전'; }
  else if (n) { cls = 'dirty'; t = `커밋 안 된 변경 ${n}`; }
  return `<button class="gitbtn" data-a="view" data-v="git"><i class="d ${cls}"></i>${t}</button>`;
}

function viewRelations(){

    </div></div>`;

function graphSVG(rels){
  const cs = S.characters; const W = 640, H = 420, cx = W / 2, cy = H / 2;
  if (!cs.length) return `<div class="empty">인물을 먼저 추가하세요.</div>`;
  const R = cs.length <= 2 ? 150 : Math.min(170, 70 + cs.length * 22);
  const pos = {};
  cs.forEach((c, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / cs.length; pos[c.id] = cs.length === 1 ? [cx, cy] : [cx + Math.cos(a) * R * 1.35, cy + Math.sin(a) * R]; });
  const pairCount = {};
  const edges = rels.filter(r => pos[r.a] && pos[r.b] && r.a !== r.b).map(r => {
    const key = [r.a, r.b].sort().join('|'); const n = pairCount[key] = (pairCount[key] || 0) + 1;
    const [x1, y1] = pos[r.a], [x2, y2] = pos[r.b];
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const off = (n - 1) * 34 * (n % 2 ? 1 : -1);
    const qx = mx - dy / len * off, qy = my + dx / len * off;
    const lx = (x1 + 2 * qx + x2) / 4, ly = (y1 + 2 * qy + y2) / 4;
    const d = `M${x1},${y1} Q${qx},${qy} ${x2},${y2}`;
    return `<g class="gedge ${r.hidden ? 'hid' : ''} ${r.id === UI.relSel ? 'on' : ''}" data-a="rel" data-id="${r.id}"><path class="hit" d="${d}"></path><path d="${d}"></path><text x="${lx}" y="${ly + 4}" text-anchor="middle">${h(r.type || '관계')}</text></g>`;
  }).join('');
  const nodes = cs.map(c => { const [x, y] = pos[c.id]; const w = Math.max(64, [...(c.name || '?')].length * 15 + 24);
    return `<g class="gnode" data-a="gochar" data-id="${c.id}"><rect x="${x - w / 2}" y="${y - 16}" width="${w}" height="32" rx="16"></rect><text x="${x}" y="${y + 5}" text-anchor="middle">${h(c.name || '?')}</text></g>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="인물 관계도">${edges}${nodes}</svg>`;
}

/* search */
function viewSearch(){
  const q = UI.q.trim();
  let html = `<div class="view"><div class="vhead"><div><h2>검색</h2><p>낱말이 들어간 곳을 찾습니다. “카구야가 달에 대해 이야기한 장면”처럼 뜻으로 찾으려면 AI 의미 검색을 누르세요.</p></div></div>
    <form class="sbox" id="searchform"><input id="q-main" type="search" value="${h(UI.q)}" placeholder="예: 달, 연구소, 카구야가 과거를 고백하는 장면" aria-label="검색어"><button class="btn pri" type="submit">검색</button><button class="btn" type="button" data-a="aisearch" ${AI.ready && q ? '' : 'disabled'}>AI 의미 검색</button></form>`;
  if (UI.aiRes){
    html += `<div class="sech">AI 의미 검색</div>`;
    if (UI.aiRes.busy) html += `<p class="thinking">원고 전체에서 뜻이 맞는 장면을 찾는 중…</p>`;
    else if (UI.aiRes.error) html += `<p class="note">${h(UI.aiRes.error)}</p>`;
    else if (!UI.aiRes.list.length) html += `<p class="note">뜻이 맞는 장면을 찾지 못했습니다.</p>`;
    else html += UI.aiRes.list.map(r => `<button class="res" data-a="scene" data-id="${h(r.sceneId)}"><span class="rt">${h(sceneLabel(r.sceneId))}</span><span class="sn">${h(r.reason)}</span></button>`).join('');
  }
  if (q){
    const terms = q.split(/\s+/).filter(Boolean);
    const res = [];
    allScenes().forEach(s => {
      const text = (s.title + '\n' + s.summary + '\n' + s.content);
      let score = 0; terms.forEach(t => score += text.split(t).length - 1);
      if (!score) return;
      const i = s.content.indexOf(terms.find(t => s.content.includes(t)) || '\u0000');
      const snip = i >= 0 ? s.content.slice(Math.max(0, i - 50), i + 90) : (s.summary || s.content.slice(0, 120));
      res.push({s, score, snip});
    });
    res.sort((a, b) => b.score - a.score);
    const mark = t => { let x = h(t); terms.forEach(tm => { x = x.split(h(tm)).join(`<mark>${h(tm)}</mark>`); }); return x; };
    html += `<div class="sech">원고 · ${res.length}개 장면</div>` + (res.map(r => `<button class="res" data-a="scene" data-id="${r.s.id}"><span class="rt">${h(sceneLabel(r.s.id))} <span class="pill p-acc">${r.score}회</span></span><span class="sn">…${mark(r.snip.replace(/\s+/g, ' '))}…</span></button>`).join('') || '<p class="note">원고에서 찾지 못했습니다.</p>');
    const ent = [];
    [['characters','인물',['name','aliases','personality','background','secret']],['lore','세계관',['title','public','secret']],['places','장소',['name','desc','secret']],['items','아이템',['name','desc','secret']],['events','연표',['title','desc']],['clues','복선',['title','desc']]].forEach(([k, lab, fs]) => {
      if (k === 'clues' && reader()) return;
      visibleItems(k).forEach(o => {
        const fields = fs.filter(f => !(reader() && f === 'secret'));
        if (terms.some(t => fields.some(f => String(o[f] || '').includes(t)))) ent.push({k, lab, o});
      });
    });
    html += `<div class="sech">설정 자료 · ${ent.length}건</div>` + (ent.map(e => `<button class="res" data-a="goent" data-k="${e.k}" data-id="${e.o.id}"><span class="rt"><span class="pill p-gry">${e.lab}</span> ${h(SCHEMA[e.k].name(e.o))}</span><span class="sn">${mark(String(SCHEMA[e.k].sub(e.o) || '').slice(0, 140))}</span></button>`).join('') || '<p class="note">설정 자료에서 찾지 못했습니다.</p>');
  }
  return html + '</div>';
}

/* style */
function styleStats(){
  const text = allScenes().map(s => s.content).join('\n');
  const sents = sentences(text);
  const total = text.replace(/\s/g, '').length || 0;
  const dlg = (text.match(/[“"「『][^”"」』]*[”"」』]/g) || []).join('').replace(/\s/g, '').length;
  const paras = text.split(/\n+/).filter(p => p.trim()).length;
  const avg = sents.length ? Math.round(sents.reduce((a, s) => a + s.length, 0) / sents.length) : 0;
  const short = sents.filter(s => s.length <= 25).length;
  return {total, sents: sents.length, avg, dlgRatio: total ? dlg / total : 0, paras, shortRatio: sents.length ? short / sents.length : 0};
}

/* GitHub view */
function viewGit(){
  return `<div class="view"><div class="vhead"><div><h2>GitHub · 버전 기록</h2><p>커밋할 때마다 작품 전체가 저장소에 한 버전으로 남습니다. 원고는 Markdown이라 GitHub에서 문장 단위로 바뀐 곳을 볼 수 있습니다.</p></div></div><div id="gitbody">${gitBodyHTML()}</div></div>`;

function renderGitBody(){ const el = $('#gitbody'); if (el) el.innerHTML = gitBodyHTML(); }
function gitBodyHTML(){
  if (!ghReady()) return `<div class="panel2"><h3>아직 GitHub에 연결하지 않았습니다</h3><p class="hint">작품 설정에서 저장소와 토큰을 넣으면 원고를 GitHub에 커밋하고 이전 버전으로 돌아갈 수 있습니다. 연결하지 않아도 이 브라우저에는 자동으로 저장됩니다.</p><div style="margin-top:12px"><button class="btn pri" data-a="view" data-v="settings">GitHub 연결하기</button></div></div>`;
  const st = store();
  let x = '';
  if (git.conflict){
    x += `<div class="banner"><b>${git.conflict.first ? '이 저장소 폴더에 이미 다른 작품이 있습니다' : 'GitHub에 새 커밋이 올라와 있습니다'}</b>
      <span>${git.conflict.first ? '다른 곳에서 올린 작품을 덮어쓰지 않도록 커밋을 멈췄습니다.' : '다른 기기나 GitHub 웹에서 먼저 커밋한 것 같습니다. 그대로 커밋하면 그 변경 위에 지금 내용을 덮어씁니다.'}</span>
      <div class="inrow"><button class="btn" data-a="pull">GitHub 버전 불러오기 (이 브라우저의 변경 버림)</button><button class="btn danger" data-a="force">내 내용으로 덮어쓰기 커밋</button></div></div>`;
  }
  const ch = git.changes;
  x += `<div class="panel2"><h3>${h(GH.owner)}/${h(GH.repo)} · ${h(GH.branch)}${GH.dir ? ' · ' + h(GH.dir) : ''} <a href="${h(st.webUrl())}" target="_blank" rel="noopener" style="font-weight:400;font-size:12.5px">GitHub에서 보기</a></h3>`;
  if (!baseValid()) x += `<p class="hint">이 저장소 폴더와 아직 맞춘 적이 없습니다. 저장소에 이미 작품이 있다면 먼저 불러오고, 비어 있다면 첫 커밋을 하세요.</p>`;
  else if (ch && !ch.length) x += `<p class="hint">마지막 커밋 이후 바뀐 내용이 없습니다.</p>`;
  if (ch && ch.length){
    x += `<div class="sech">커밋할 변경 · 파일 ${ch.length}개</div><div class="changes">${ch.map(c => `<span class="${c.kind}">${c.kind === 'a' ? '+ 추가' : c.kind === 'r' ? '− 삭제' : '~ 수정'}  ${h(pathLabel(c.path))} <span style="color:var(--mute)">${h(c.path)}</span></span>`).join('')}</div>`;
  }
  x += `<div class="inrow" style="margin-top:10px"><input id="commit-msg" placeholder="${h(suggestMsg())}" aria-label="커밋 메시지"><button class="btn pri" data-a="commit" ${git.busy ? 'disabled' : ''}>${git.busy === 'commit' ? '커밋 중…' : '커밋'}</button><button class="btn" data-a="pull" ${git.busy ? 'disabled' : ''}>${git.busy === 'pull' ? '불러오는 중…' : 'GitHub에서 불러오기'}</button></div>
    <p class="hint">커밋 메시지를 비워 두면 자리표시 문구가 쓰입니다. 단축키 Ctrl+S(⌘+S)로도 커밋합니다.</p>`;
  if (git.msg) x += `<p class="note" style="margin-top:10px">${h(git.msg)}</p>`;
  if (git.err) x += `<p class="note" style="margin-top:10px;color:var(--red)">${h(git.err)}</p>`;
  x += `</div>`;
  x += `<div class="panel2"><h3>버전 기록</h3>`;
  if (!git.history) x += `<p class="thinking">기록을 불러오는 중…</p>`;
  else if (!git.history.length) x += `<p class="hint">아직 커밋이 없습니다.</p>`;
  else x += `<div class="commits">${git.history.map((c, i) => `<div class="commit ${git.loadedFrom === c.sha || (!git.loadedFrom && baseValid() && base.sha === c.sha) ? 'cur' : ''}">
      <span class="msg">${h(c.message.split('\n')[0])}</span>
      <span class="grp" style="display:flex;gap:6px">${i === 0 ? '' : `<button class="btn" data-a="restore" data-id="${c.sha}">이 버전 불러오기</button>`}</span>
      <span class="by"><a class="sha" href="${h(c.url)}" target="_blank" rel="noopener">${c.sha.slice(0, 7)}</a> · ${h(c.author || '')} · ${c.date ? new Date(c.date).toLocaleString('ko-KR') : ''}</span></div>`).join('')}</div>`;
  x += `<p class="hint">이전 버전을 불러오면 이 브라우저의 작품이 그 버전으로 바뀝니다. 커밋하면 그 상태가 새 버전으로 기록되고, 기존 기록은 지워지지 않습니다.</p></div>`;
  return x;
}

/* AI panel */
function renderAI(){
  const is = allIssues();
  const cnt = t => is.filter(i => t.includes(i.type)).length;
  const tiles = [['conflict','설정 충돌','t-red',cnt(['conflict'])],['logic','개연성','t-org',cnt(['logic'])],['character','인물 일관성','t-yel',cnt(['character','knowledge'])],['clues','미회수 복선','t-blu',openClues().length]];
  const readyList = Object.keys(SFAI.PROVIDERS).filter(providerReady);
  let html = `<div class="aih"><b>AI 편집자</b>${AI.ready ? '<span class="pill p-grn">사용 가능</span>' : '<span class="pill p-gry">설정 필요</span>'}</div>`;
  if (!reader() && readyList.length) html += `<label class="fld" style="margin-bottom:12px"><span>쓰는 AI</span><select id="ai-switch" data-aiswitch="1">${readyList.map(p => `<option value="${p}" ${p === AIcfg.active ? 'selected' : ''}>${h(SFAI.PROVIDERS[p].label)} · ${h(AIcfg.providers[p].model)}</option>`).join('')}${readyList.includes(AIcfg.active) ? '' : '<option selected disabled>고르세요</option>'}</select></label>`;
  if (reader()){ $('#ai').innerHTML = html + `<p class="note">독자 모드에서는 스포일러가 담긴 편집 메모를 숨깁니다. 작가 모드로 바꾸면 다시 보입니다.</p>`; return; }
  html += `<div class="tiles">${tiles.map(([k, l, c, v]) => `<button class="tile ${c} ${UI.aiFilter === k ? 'on' : ''}" data-a="filter" data-v="${k}"><span class="v">${v}</span><span class="l">${l}</span></button>`).join('')}</div>`;
  if (!AI.ready) html += `<p class="note" style="margin-bottom:12px">작품 설정에서 Claude, ChatGPT, Gemini 같은 AI 제공자의 API 키를 넣으면 설정 검사, 문장 다듬기, 전개 제안을 쓸 수 있습니다. 나이 불일치와 금지어 검사는 키 없이도 동작합니다. <a href="#" data-a="view" data-v="settings">설정 열기</a></p>`;
  html += workHTML();
  if (UI.aiFilter === 'clues'){
    const cl = openClues();
    html += `<div class="sech">미회수 복선 ${cl.length}개</div>` + (cl.map(c => `<div class="iss"><div class="hd"><b>${h(c.title)}</b><span class="pill ${CLUE_PILL[c.status]}">${(CLUE_ST.find(x => x[0] === c.status) || [,''])[1]}</span></div>
      <span class="loc">${c.firstScene ? '최초 ' + h(sceneLabel(c.firstScene)) : '최초 장면 미지정'}${c.revealScene ? ' → 회수 예정 ' + h(sceneLabel(c.revealScene)) : ''}</span>
      <div class="row"><button class="btn" data-a="goent" data-k="clues" data-id="${c.id}">복선으로 이동</button></div></div>`).join('') || '<p class="note">모든 복선이 회수되었습니다.</p>');
  } else {
    const types = {conflict:['conflict'], logic:['logic'], character:['character','knowledge']}[UI.aiFilter] || null;
    const list = is.filter(i => !types || types.includes(i.type)).sort((a, b) => (a.local ? 1 : 0) - (b.local ? 1 : 0) || (b.at || 0) - (a.at || 0));
    html += `<div class="sech">${types ? tiles.find(t => t[0] === UI.aiFilter)[1] : '검토할 이슈'} ${list.length}건${UI.aiFilter ? ` · <a href="#" data-a="filter" data-v="">전체 보기</a>` : ''}</div>`;
    html += list.map(i => `<div class="iss"><div class="hd"><span class="pill ${ISS[i.type][1]}">${ISS[i.type][0]}</span><span class="loc">${h(sceneLabel(i.sceneId))}</span></div>
      ${i.quote ? `<q>${h(i.quote)}</q>` : ''}<div class="msg">${h(i.message)}</div>${i.basis ? `<div class="basis">근거: ${h(i.basis)}</div>` : ''}
      <div class="row"><button class="btn" data-a="issgo" data-id="${i.id}">검토하기</button><button class="btn" data-a="issdis" data-id="${i.id}">무시</button></div></div>`).join('')
      || `<p class="note">검토할 이슈가 없습니다. 장면을 열고 ‘설정 검사’를 누르면 AI가 설정·개연성·인물 지식을 확인합니다.</p>`;
  }
  $('#ai').innerHTML = html;
}
function workHTML(){
  const w = aiWork; if (!w) return '';
  const stop = `<button class="btn" data-a="stop">중단</button>`;
  if (w.kind === 'rewrite') return `<div class="work"><h5>${h(w.label)}</h5><div class="orig">${h(w.orig)}</div>
      ${w.busy && !w.out ? `<div class="thinking">다듬는 중…</div>` : `<div class="out">${h(w.out)}</div>`}
      ${w.err ? `<p class="note">${h(w.err)}</p>` : ''}
      <div class="row">${w.busy ? stop : `${w.out ? '<button class="btn pri" data-a="apply">원고에 적용</button>' : ''}<button class="btn" data-a="rw" data-v="${w.key}" data-again="1">다시</button><button class="btn" data-a="closework">닫기</button>`}</div></div>`;
  if (w.kind === 'check') return `<div class="work"><h5>설정 검사 · ${h(w.label)}</h5>${w.busy ? `<div class="thinking">설정 DB와 장면을 대조하는 중…</div><div class="row">${stop}</div>` : `<div>${h(w.msg)}</div><div class="row"><button class="btn" data-a="closework">닫기</button></div>`}</div>`;
  if (w.kind === 'beats'){
    let x = `<div class="work"><h5>전개 제안 · ${h(w.label)}</h5>
      <label class="fld"><span>지금 상황</span><textarea id="beat-sit">${h(w.situation)}</textarea></label>`;
    if (w.busy === 'opts') x += `<div class="thinking">전개 선택지를 떠올리는 중…</div><div class="row">${stop}</div>`;
    else if (!w.options.length) x += `<div class="row"><button class="btn pri" data-a="beatsgo">선택지 받기</button><button class="btn" data-a="closework">닫기</button></div>`;
    else {
      x += `<span style="font-size:12px;color:var(--mute)">쓰고 싶은 순서대로 누르세요. 문장은 고른 뒤에만 씁니다.</span>` +
        w.options.map((o, i) => { const p = w.picked.indexOf(i); return `<button class="beat ${p >= 0 ? 'on' : ''}" data-a="beatpick" data-i="${i}"><span class="o">${p >= 0 ? p + 1 : ''}</span><span>${h(o)}</span></button>`; }).join('');
      if (w.busy === 'draft') x += `${w.draft ? `<div class="out">${h(w.draft)}</div>` : '<div class="thinking">고른 순서로 초안을 쓰는 중…</div>'}<div class="row">${stop}</div>`;
      else if (w.draft) x += `<div class="out">${h(w.draft)}</div><div class="row"><button class="btn pri" data-a="insert" data-v="cursor">커서 위치에 넣기</button><button class="btn" data-a="insert" data-v="end">장면 끝에 붙이기</button><button class="btn" data-a="draft">다시 쓰기</button></div>`;
      else x += `<div class="row"><button class="btn pri" data-a="draft" ${w.picked.length ? '' : 'disabled'}>고른 순서로 초안 쓰기</button><button class="btn" data-a="beatsgo">다른 선택지</button><button class="btn" data-a="closework">닫기</button></div>`;
    }
    if (w.err) x += `<p class="note">${h(w.err)}</p>`;
    return x + '</div>';
  }
  if (w.kind === 'error') return `<div class="work"><div>${h(w.msg)}</div><div class="row"><button class="btn" data-a="closework">닫기</button></div></div>`;
  return '';
}

async function ask(prompt, {json = false, onText, maxTokens} = {}){
  aiCtl = new AbortController();

}

function worldContext(){
  const L = [];
  L.push(`[작품] ${S.meta.title}${S.meta.genre ? ' / ' + S.meta.genre : ''}${S.meta.description ? '\n' + S.meta.description : ''}`);
  L.push('\n[인물]');
  S.characters.forEach(c => {
    L.push(`- ${c.name}${c.aliases ? ' (별칭: ' + c.aliases + ')' : ''}: 나이 ${c.age || '미정'}; ${[c.gender, c.species, c.occupation, c.status].filter(Boolean).join(', ')}. 성격: ${c.personality || '-'} 말투: ${c.speech || '-'} 배경: ${c.background || '-'} 비밀(독자 미공개): ${c.secret || '-'}`);
    if ((c.knows || []).length) L.push(`  · ${c.name}의 지식 상태: ` + c.knows.map(k => `${k.topic} = ${KN[k.state]}`).join('; '));
  });
  if (S.relations.length){ L.push('\n[관계]'); S.relations.forEach(r => L.push(`- ${charName(r.a)} —${r.type}— ${charName(r.b)}: ${r.desc || ''}`)); }
  const lore = S.lore.filter(l => l.aiVisible !== false);
  if (lore.length){ L.push('\n[세계관]'); lore.forEach(l => L.push(`- ${l.title}: 공개 정보: ${l.public || '-'} / 작가만 아는 사실: ${l.secret || '-'}`)); }
  if (S.places.length){ L.push('\n[장소]'); S.places.forEach(p => L.push(`- ${p.name}: ${p.desc || ''} ${p.secret ? '(숨겨진 사실: ' + p.secret + ')' : ''}`)); }
  if (S.events.length){ L.push('\n[연표] (현재 = 0년)'); S.events.slice().sort((a,b) => (a.year||0) - (b.year||0)).forEach(e => L.push(`- ${yearLabel(e.year)}: ${e.title}${e.desc ? ' — ' + e.desc : ''}`)); }
  if (S.items.length){ L.push('\n[아이템]'); S.items.forEach(i => L.push(`- ${i.name}${i.owner ? ' (소유: ' + charName(i.owner) + ')' : ''}: ${i.desc || ''} ${i.secret || ''}`)); }
  if (S.clues.length){ L.push('\n[복선]'); S.clues.forEach(c => L.push(`- ${c.title} [${(CLUE_ST.find(x => x[0] === c.status) || [,''])[1]}]: ${c.desc || ''}${c.revealScene ? ' / 회수 예정: ' + sceneLabel(c.revealScene) : ''}`)); }
  return L.join('\n').slice(0, 30000);
}
function outline(){ return allScenes().map(s => `${sceneLabel(s.id)}: ${(s.summary || s.content.slice(0, 110)).replace(/\s+/g, ' ')}`).join('\n').slice(0, 10000); }
function styleNote(){ return S.style.summary ? `\n[이 작품의 문체 프로필]\n${S.style.summary}${S.style.preferred ? '\n선호 표현: ' + S.style.preferred : ''}${S.style.forbidden ? '\n쓰지 말 것: ' + S.style.forbidden : ''}` : ''; }

async function doRewrite(key){
  const sc = cur(); if (!sc) return;
  let {start, end} = lastSel;
  let orig;
  if (aiWork && aiWork.kind === 'rewrite' && aiWork.key === key && aiWork.again){ orig = aiWork.orig; start = aiWork.start; end = aiWork.end; }
  else { if (end <= start) return; orig = sc.content.slice(start, end); }
  const r = REWRITES.find(x => x[0] === key);
  aiWork = {kind:'rewrite', key, label:r[1], orig, start, end, sceneId:sc.id, out:'', busy:true};
  renderAI(); openAIDrawer();
  const before = sc.content.slice(Math.max(0, start - 600), start), after = sc.content.slice(end, end + 400);
  const prompt = `너는 한국어 장편소설의 문장 편집자다. 아래 [선택 부분]을 다음 지시에 따라 고쳐 써라.\n지시: ${r[2]}\n규칙: 설정과 인물의 말투를 지킨다. 앞뒤 문맥과 자연스럽게 이어지게 한다. 고친 문장만 출력한다. 설명, 머리말, 따옴표로 감싸기, 선택지 나열을 하지 않는다.${styleNote()}\n\n[인물 요약]\n${S.characters.map(c => `- ${c.name}: 말투 ${c.speech || '-'}`).join('\n')}\n\n[앞 문맥]\n${before}\n\n[선택 부분]\n${orig}\n\n[뒤 문맥]\n${after}`;
  try {
    const {text} = await ask(prompt, {onText: ({text}) => { aiWork.out = text; const o = document.querySelector('#ai .out'); if (o) o.textContent = text; else renderAI(); }});
    aiWork.out = text.trim(); aiWork.busy = false;
  } catch(e){ aiWork.busy = false; aiWork.out = (e && e.text) || aiWork.out; aiWork.err = aiErr(e); }
  aiWork.again = false; renderAI();
}
function applyRewrite(){
  const w = aiWork; const sc = byId('scenes', w.sceneId); if (!sc || !w.out) return;
  let s = w.start, e = w.end;
  if (sc.content.slice(s, e) !== w.orig){ const i = sc.content.indexOf(w.orig); if (i < 0){ w.err = '원문이 그사이 바뀌어 적용할 위치를 찾지 못했습니다. 결과를 복사해 직접 붙여 넣으세요.'; renderAI(); return; } s = i; e = i + w.orig.length; }
  sc.content = sc.content.slice(0, s) + w.out + sc.content.slice(e);
  touch(); localIssues[sc.id] = lintScene(sc);
  aiWork = null; UI.sceneId = sc.id; UI.view = 'write'; renderMain(); renderAI(); renderStatus();
  const ta = $('#ms'); if (ta){ ta.focus(); ta.setSelectionRange(s, s + w.out.length); lastSel = {start:s, end:s + w.out.length}; trackSel(); }
}

async function doCheck(){
  const sc = cur(); if (!sc) return;
  if (!sc.content.trim()){ aiWork = {kind:'error', msg:'장면에 원고가 없어 검사할 내용이 없습니다.'}; renderAI(); return; }
  aiWork = {kind:'check', label: sceneLabel(sc.id), busy:true}; renderAI(); openAIDrawer();
  const prompt = `너는 한국어 장편소설의 설정 담당 편집자다. [설정 DB]와 [원고 흐름]을 기준으로 [검사할 장면]을 읽고 문제를 찾아라.
찾을 것: (conflict) 설정·연표·나이와 어긋나는 서술, (logic) 앞뒤가 맞지 않거나 개연성이 부족한 전개, (character) 인물의 성격·말투에서 벗어난 행동이나 대사, (knowledge) 인물이 '모름'으로 설정된 정보를 아는 듯 말하거나 행동하는 경우.
규칙: 수정하지 말고 지적만 한다. 의도된 거짓말·기억상실·시간 왜곡일 수 있으면 그 가능성도 한 문장으로 적는다. 확실하지 않은 사소한 문제는 빼고, 최대 8건. 문제가 없으면 빈 배열.
출력 형식: [{"type":"conflict|logic|character|knowledge","quote":"장면 속 해당 문장을 원문 그대로 60자 이내","message":"무엇이 왜 문제인지 1~2문장","basis":"근거가 된 설정 항목 이름"}]

[설정 DB]
${worldContext()}

[원고 흐름]
${outline()}

[검사할 장면: ${sceneLabel(sc.id)}${sc.pov ? ' / 시점 인물: ' + charName(sc.pov) : ''}${sc.time ? ' / 작중 시간: ' + sc.time : ''}]
${sc.content.slice(0, 20000)}`;
  try {
    const res = await ask(prompt, {json:true});
    const list = Array.isArray(res) ? res : (res && Array.isArray(res.issues) ? res.issues : []);
    S.issues = S.issues.filter(i => i.sceneId !== sc.id);
    list.slice(0, 8).forEach(x => {
      S.issues.push({id: uid('is'), sceneId: sc.id, type: ['conflict','logic','character','knowledge'].includes(x.type) ? x.type : 'logic',
        quote: String(x.quote || '').slice(0, 160), message: String(x.message || ''), basis: String(x.basis || ''), at: Date.now()});
    });
    touch();
    aiWork = {kind:'check', label: sceneLabel(sc.id), busy:false, msg: list.length ? `${list.length}건을 찾았습니다. 원고는 고치지 않았습니다. 아래 목록에서 하나씩 검토하세요.` : '설정과 어긋나는 부분을 찾지 못했습니다.'};
  } catch(e){ aiWork = {kind:'error', msg: aiErr(e)}; }
  renderAI(); renderStatus(); renderSide();
}

function insertDraft(where){
  const w = aiWork; const sc = byId('scenes', w.sceneId); if (!sc || !w.draft) return;

const EX = {scope: 'all', busy: false, err: '', note: '', rows: [], diag: ''};
const EX_KINDS = {
  characters: {label: '인물', nameKey: 'name', fields: [['name','이름'],['aliases','별칭'],['age','나이'],['gender','성별'],['species','종족'],['occupation','직업'],['status','현재 상태'],['personality','성격','ta'],['appearance','외모','ta'],['speech','말투','ta'],['background','배경','ta'],['secret','비밀','ta'],['knows','지식 상태 (한 줄에 “정보 = 알고 있음/의심 중/모름”)','ta']]},
