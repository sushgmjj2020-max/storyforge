  items: {label: '아이템', nameKey: 'name', fields: [['name','이름'],['owner','소유자 (인물 이름)'],['desc','설명','ta'],['secret','숨겨진 의미','ta']]},
  events: {label: '연표', nameKey: 'title', fields: [['title','사건'],['year','연도 (현재 = 0)'],['desc','설명','ta']]},
  relations: {label: '관계', nameKey: null, fields: [['a','인물 A (이름)'],['b','인물 B (이름)'],['type','관계'],['desc','설명','ta'],['evidence','근거 장면','ta']]},
  clues: {label: '복선', nameKey: 'title', fields: [['title','복선'],['firstScene','최초 등장 장면'],['desc','내용과 회수 계획','ta']]}
};
const knowsToText = arr => (arr || []).map(k => `${k.topic} = ${KN[k.state] || '모름'}`).join('\n');
const textToKnows = t => String(t || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
  const m = l.split(/\s*=\s*/); const st = Object.entries(KN).find(([, v]) => (m[1] || '').includes(v));
  return {topic: m[0], state: st ? st[0] : 'unknown'};
});
const charByName = n => { n = String(n || '').trim(); return n ? S.characters.find(c => c.name === n || String(c.aliases || '').split(/[,、]/).map(x => x.trim()).includes(n)) : null; };
function exScopeScenes(){
  const sc = cur();
  if (EX.scope === 'scene' && sc) return [sc];
  if (EX.scope === 'chapter' && sc) return scenesOf(sc.chapterId);
  return allScenes();
}
function dbSnapshot(){
  const pick = (o, keys) => Object.fromEntries(keys.filter(k => o[k] !== undefined && o[k] !== '' && !(Array.isArray(o[k]) && !o[k].length)).map(k => [k, o[k]]));
  return JSON.stringify({
    characters: S.characters.map(c => Object.assign(pick(c, ['name','aliases','age','gender','species','occupation','status','personality','appearance','speech','background','secret']), c.knows && c.knows.length ? {knows: knowsToText(c.knows)} : {})),
    lore: S.lore.map(l => pick(l, ['title','category','public','secret'])),
    places: S.places.map(p => pick(p, ['name','region','desc','secret'])),
    items: S.items.map(i => Object.assign(pick(i, ['name','desc','secret']), i.owner ? {owner: charName(i.owner)} : {})),
    events: S.events.map(e => pick(e, ['title','year','desc'])),
    relations: S.relations.map(r => ({a: charName(r.a), b: charName(r.b), type: r.type, desc: r.desc || ''})),
    clues: S.clues.map(c => pick(c, ['title','desc','status']))
  }, null, 1).slice(0, 30000);
}
async function runExtract(){
  const scenes = exScopeScenes();
  const text = scenes.map(s => `<scene id="${s.id}" label="${sceneLabel(s.id)}">\n${s.content}\n</scene>`).join('\n');
  if (!text.replace(/<[^>]+>/g, '').trim()){ EX.err = '정리할 원고가 없습니다.'; renderMain(); return; }
  EX.busy = true; EX.err = ''; EX.note = ''; EX.rows = []; renderMain();
  const cut = text.length > 70000;
  const prompt = `너는 한국어 장편소설의 설정 담당 편집자다. [원고]를 읽고 [현재 설정 DB]에 추가하거나 고쳐야 할 내용을 정리하라.
규칙:
- 원고에 실제로 나온 내용이나 원고에서 분명히 추론되는 내용만 쓴다. 지어내지 않는다.
- 이미 있는 항목은 "match"에 그 이름을 적고, 새로 알게 된 필드나 원고와 달라진 필드만 넣는다. 같은 내용은 넣지 않는다.
- 새 항목은 "match": null.
- 원고에서 독자에게 아직 숨겨진 사실은 secret 필드에 적는다.
- 인물의 knows는 "정보 = 알고 있음|의심 중|모름" 형식의 여러 줄 문자열.
- events.year는 현재를 0으로 둔 정수(과거는 음수). 모르면 그 사건을 빼라.
- clues.firstScene은 원고의 scene id 그대로.
- 각 항목에 reason(근거 장면과 이유 한 문장)을 넣는다. 전체 30개 이하. 없는 분류는 빈 배열.
출력 형식:
{"diagnosis":"설정 전반에 대한 한두 문장 메모","characters":[{"match":null,"name":"","aliases":"","age":"","gender":"","species":"","occupation":"","status":"","personality":"","appearance":"","speech":"","background":"","secret":"","knows":"","reason":""}],"lore":[{"match":null,"title":"","category":"","public":"","secret":"","reason":""}],"places":[{"match":null,"name":"","region":"","desc":"","secret":"","reason":""}],"items":[{"match":null,"name":"","owner":"","desc":"","secret":"","reason":""}],"events":[{"match":null,"title":"","year":0,"desc":"","reason":""}],"relations":[{"a":"인물 이름","b":"인물 이름","type":"","desc":"","evidence":"","reason":""}],"clues":[{"match":null,"title":"","firstScene":"","desc":"","reason":""}]}

[현재 설정 DB]
${dbSnapshot()}

[원고${cut ? ' (길어서 앞부분만)' : ''}]
${text.slice(0, 70000)}`;
  try {
    const res = await ask(prompt, {json: true, maxTokens: 16000});
    EX.rows = buildExRows(res || {});
    EX.diag = String((res && res.diagnosis) || '');
    EX.note = EX.rows.length ? `제안 ${EX.rows.length}건입니다. 내용을 고치거나 빼고 싶은 칸의 체크를 푼 뒤 적용하세요.` : '새로 정리할 내용을 찾지 못했습니다.';
    if (cut) EX.note += ' 원고가 길어 앞부분만 읽었습니다. 범위를 장이나 장면으로 좁혀 나머지도 정리하세요.';
  } catch(e){ EX.err = aiErr(e); }
  EX.busy = false; if (UI.view === 'extract') renderMain();
}
function buildExRows(res){
  const rows = [];
  Object.keys(EX_KINDS).forEach(kind => {
    const K = EX_KINDS[kind];
    (Array.isArray(res[kind]) ? res[kind] : []).forEach(item => {
      if (!item || typeof item !== 'object') return;
      let target = null;
      if (kind === 'relations'){
        const a = charByName(item.a), b = charByName(item.b);
        if (a && b) target = S.relations.find(r => ((r.a === a.id && r.b === b.id) || (r.a === b.id && r.b === a.id)) && (!item.type || r.type === item.type)) || null;
      } else {
        const nm = String(item.match || item[K.nameKey] || '').trim();
        target = nm ? (kind === 'characters' ? charByName(nm) : S[kind].find(o => o[K.nameKey] === nm)) : null;
      }
      const fields = [];
      K.fields.forEach(([key, label, type]) => {
        let v = item[key];
        if (v === undefined || v === null) return;
        if (key === 'knows' && Array.isArray(v)) v = knowsToText(v);
        if (key === 'firstScene' && byId('scenes', String(v).trim())) v = sceneLabel(String(v).trim());
        v = String(v).trim();
        if (!v) return;
        let old = target ? target[key] : undefined;
        if (key === 'knows') old = target ? knowsToText(target.knows) : '';
        if (key === 'owner' && old) old = charName(old);
        if ((key === 'a' || key === 'b') && old) old = charName(old);
        if (key === 'firstScene' && old) old = sceneLabel(old);
        old = old === undefined || old === null ? '' : String(old);
        if (target && old === v) return;
        fields.push({key, label, type: type || 'text', value: v, old, on: true});
      });
      if (!fields.length) return;
      const title = kind === 'relations' ? `${item.a || '?'} — ${item.type || '관계'} — ${item.b || '?'}` : (item[K.nameKey] || item.match || (target && target[K.nameKey]) || '이름 없음');
      rows.push({id: uid('x'), kind, targetId: target ? target.id : null, title: String(title), reason: String(item.reason || ''), fields, on: true});
    });
  });
  return rows;
}
function applyExtract(){
  const order = ['characters','places','lore','items','events','clues','relations'];
  let n = 0;
  order.forEach(kind => EX.rows.filter(r => r.kind === kind && r.on).forEach(row => {
    const data = {};
    row.fields.filter(f => f.on).forEach(f => { data[f.key] = f.value; });
    if (!Object.keys(data).length) return;
    if ('knows' in data) data.knows = textToKnows(data.knows);
    if ('owner' in data){ const c = charByName(data.owner); data.owner = c ? c.id : ''; }
    if ('a' in data){ const c = charByName(data.a); if (c) data.a = c.id; else delete data.a; }
    if ('b' in data){ const c = charByName(data.b); if (c) data.b = c.id; else delete data.b; }
    if ('year' in data){ const y = parseInt(data.year, 10); data.year = isNaN(y) ? 0 : y; }
    if ('firstScene' in data && !byId('scenes', data.firstScene)){ const s = allScenes().find(x => sceneLabel(x.id) === data.firstScene || x.title === data.firstScene); data.firstScene = s ? s.id : ''; }
    let target = row.targetId ? byId(kind, row.targetId) : null;
    if (target){
      if (kind === 'characters' && data.knows){
        const map = new Map((target.knows || []).map(k => [k.topic, k]));
        data.knows.forEach(k => map.set(k.topic, k));
        data.knows = [...map.values()];
      }
      Object.assign(target, data);
    } else {
      if (kind === 'relations' && (!data.a || !data.b)) return;
      const o = Object.assign({id: uid(kind.slice(0, 2))}, SCHEMA[kind].blank(), data);
      if (kind === 'lore' && !LORE_CAT.find(c => c[0] === o.category)) o.category = 'history';
      if (kind === 'clues'){ o.status = o.status || 'UNRESOLVED'; o.hints = o.hints || []; }
      S[kind].push(o);
    }
    n++;
  }));
  EX.rows = EX.rows.filter(r => !r.on);
  EX.note = `${n}개 항목을 설정 DB에 반영했습니다.${EX.rows.length ? ` 적용하지 않은 제안 ${EX.rows.length}건은 아래에 남아 있습니다.` : ''} 각 항목은 인물·세계관 화면에서 언제든 직접 고칠 수 있습니다.`;
  normalize(); relintAll(); touch();
  renderSide(); renderAI(); renderMain();
}

function planToOutline(plan){

      S.scenes.push(sc); nsc++; localIssues[sc.id] = [];

function addScene(cid){
  const order = Math.max(0, ...scenesOf(cid).map(s => s.order || 0)) + 1;
  const sc = {id: uid('sc'), chapterId: cid, title: '새 장면', content: '', summary: '', order, pov: '', placeId: '', time: ''};
  S.scenes.push(sc); touch(); localIssues[sc.id] = [];

function deleteScene(id){
  const list = allScenes(); const idx = list.findIndex(s => s.id === id);
  S.scenes = S.scenes.filter(s => s.id !== id);
  S.issues = S.issues.filter(i => i.sceneId !== id); delete localIssues[id];
  touch();
  const rest = allScenes(); UI.sceneId = (rest[idx] || rest[idx - 1] || {}).id || null;
  render();
}
function deleteChapter(cid){
  const ids = scenesOf(cid).map(s => s.id);
  S.scenes = S.scenes.filter(s => !ids.includes(s.id));
  S.issues = S.issues.filter(i => !ids.includes(i.sceneId)); ids.forEach(id => delete localIssues[id]);
  S.chapters = S.chapters.filter(c => c.id !== cid); touch();
  UI.sceneId = (allScenes()[0] || {}).id || null; render();
}
function moveScene(dir){
  const sc = cur(); if (!sc) return;
  const sib = scenesOf(sc.chapterId); const i = sib.findIndex(s => s.id === sc.id); const j = i + dir;
  if (j >= 0 && j < sib.length){
    const o = sib[j]; const t = sc.order; sc.order = o.order; o.order = t;
    if (sc.order === o.order) sc.order += dir;
  } else {
    const chs = chapters(); const ci = chs.findIndex(c => c.id === sc.chapterId) + dir;
    if (ci < 0 || ci >= chs.length) return;
    const tgt = scenesOf(chs[ci].id);
    sc.chapterId = chs[ci].id;
    sc.order = dir > 0 ? Math.min(1, ...tgt.map(s => s.order)) - 1 : Math.max(0, ...tgt.map(s => s.order)) + 1;
  }
  touch(); renderSide(); renderMain(); renderStatus();
}

    case 'restore': arm(t, 'restore' + id, () => ghPull(id), '한 번 더 누르면 불러오기'); break;
    /* AI settings */
    case 'aitest': { const p = UI.aiEdit || AIcfg.active, c = aiClientFor(p); UI.aiTest = '확인 중…'; renderMain();
      c.ask('"확인"이라고만 한 단어로 답하라.', {maxTokens: 1024}).then(r => { UI.aiTest = `동작합니다 · ${c.label} · ${AIcfg.providers[p].model} · 답: ${r.text.trim().slice(0, 20)}`; }).catch(err => { UI.aiTest = aiErr(err); }).finally(() => { if (UI.view === 'settings') renderMain(); }); break; }
    case 'aimodels': { const p = UI.aiEdit || AIcfg.active; UI.aiTest = '모델 목록을 불러오는 중…'; renderMain();
      aiClientFor(p).listModels().then(list => { modelLists[p] = list; UI.aiTest = list.length ? `모델 ${list.length}개를 찾았습니다. 모델 칸을 누르면 목록에서 고를 수 있습니다.` : '쓸 수 있는 모델을 찾지 못했습니다.'; }).catch(err => { UI.aiTest = aiErr(err); }).finally(() => { if (UI.view === 'settings') renderMain(); }); break; }
    case 'aiuse': AIcfg.active = UI.aiEdit || AIcfg.active; saveAIcfg(); UI.aiTest = `이제 ${AI.label}를 씁니다.`; render(); break;
    case 'aiforget': { const p = UI.aiEdit || AIcfg.active; AIcfg.providers[p].key = ''; saveAIcfg(); UI.aiTest = ''; render(); break; }
    /* files */
    case 'exjson': download(`${fileBase()}-백업.json`, JSON.stringify(Object.assign({format:'storyforge', version:1, exportedAt: new Date().toISOString()}, S), null, 2), 'application/json'); break;
    case 'extxt': download(`${fileBase()}.txt`, manuscriptText(), 'text/plain;charset=utf-8'); break;
    case 'import': $('#importFile').click(); break;
    case 'importgo': { const d = UI.pendingImport; UI.pendingImport = null; delete d.format; delete d.version; delete d.exportedAt; replaceState(d); UI.exMsg = '백업을 가져왔습니다.'; render(); break; }
    case 'importcancel': UI.pendingImport = null; renderMain(); break;
    case 'loadsample': arm(t, 'sample', () => { replaceState(window.SF_SAMPLE); UI.exMsg = '예시 작품을 불러왔습니다.'; UI.view = 'write'; render(); }, '한 번 더 누르면 지금 작품 대신 불러오기'); break;
    case 'newproj': arm(t, 'newproj', () => { replaceState(starterState()); UI.view = 'write'; render(); }, '한 번 더 누르면 비우기'); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.view){ onViewInput(t); if (t.dataset.view === 'focus') renderTop(); return; }
  if (t.dataset.exrow){ const r = EX.rows.find(x => x.id === t.dataset.exrow); if (r){ r.on = t.checked; t.closest('.exrow').classList.toggle('off', !r.on); document.querySelectorAll('[data-a=exapply]').forEach(b => { const n = EX.rows.filter(x => x.on).length; b.textContent = `선택한 ${n}개 적용`; b.disabled = !n; }); } return; }
  if (t.dataset.exfon){ const r = EX.rows.find(x => x.id === t.dataset.exfon); if (r){ r.fields[Number(t.dataset.i)].on = t.checked; t.closest('.exf').classList.toggle('off', !t.checked); } return; }
  if (t.dataset.exf){ const r = EX.rows.find(x => x.id === t.dataset.exf); if (r) r.fields[Number(t.dataset.i)].value = t.value; return; }
  if (t.dataset.plopt){ PL[t.dataset.plopt] = t.dataset.plopt === 'count' ? Number(t.value) : t.value; return; }
  if (t.dataset.pl){ const p = getPlan(t.dataset.pl, Number(t.dataset.pi)); if (p){ setByPath(p, t.dataset.path, t.value); if (t.dataset.pl === 's') touch(); } return; }
  if (t.dataset.gh){
    const f = t.dataset.gh;
    GH[f] = t.type === 'checkbox' ? t.checked : t.value.trim();
    saveGH(); git.info = null; git.remoteState = null; git.err = ''; git.conflict = null; git.history = null;
    scheduleChanges(); renderTop(); return;
  }
  if (t.dataset.aiprov){ UI.aiEdit = t.value; UI.aiTest = ''; renderMain(); return; }
  if (t.dataset.aiswitch){ AIcfg.active = t.value; saveAIcfg(); renderAI(); if (UI.view === 'write') renderMain(); return; }
  if (t.dataset.ai){ const p = UI.aiEdit || AIcfg.active; AIcfg.providers[p][t.dataset.ai] = t.value.trim(); saveAIcfg(); UI.aiTest = ''; renderAI(); return; }
  if (t.dataset.kn != null){
    const c = byId('characters', t.dataset.id); if (!c) return;
    c.knows[Number(t.dataset.kn)][t.dataset.kf] = t.value; touch(); return;
  }
  if (t.id === 'beat-sit' && aiWork){ aiWork.situation = t.value; return; }
  if (t.id === 'q-top' || t.id === 'q-main'){ UI.q = t.value; return; }
  if (!t.dataset.k) return;
  const {k, id, f} = t.dataset;
  const obj = k === 'meta' ? S.meta : k === 'style' ? S.style : byId(k, id);
  if (!obj) return;
  let val;
  if (t.type === 'checkbox') val = t.checked;
  else if (t.multiple) val = [...t.selectedOptions].map(o => o.value);
  else if (t.dataset.t === 'num') val = t.value === '' ? 0 : Number(t.value);
  else val = t.value;
  obj[f] = val;
  touch();
  if (k === 'scenes' && f === 'content'){ lastSel = {start: t.selectionStart, end: t.selectionEnd}; renderStatus(); scheduleLint(id); }
  if ((k === 'scenes' || k === 'chapters') && f === 'title'){ renderSide(); renderStatus(); }
  if (k === 'meta') renderTop();
  if (k === 'characters' && (f === 'age' || f === 'name' || f === 'aliases')){ relintAll(); renderAI(); renderStatus(); }
  if (k === 'style' && f === 'forbidden'){ relintAll(); renderAI(); renderStatus(); }
  if (SCHEMA[k] && UI.view === k && $('#list')) $('#list').innerHTML = listHTML(k);
  if (k === 'clues') renderSide();
  if (k === 'relations' && UI.view === 'relations'){
    $('#graph').innerHTML = graphSVG(visibleItems('relations'));
    $('#list').innerHTML = relListHTML(visibleItems('relations'));
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'topsearch' || e.target.id === 'searchform'){
    UI.aiRes = null; UI.view = 'search'; renderSide(); renderMain();
    const q = $('#q-main'); if (q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's'){
    e.preventDefault(); clearTimeout(saveT); saveLocal();
    if (ghReady() && !git.busy){ if (UI.view !== 'git'){ UI.view = 'git'; git.history = null; renderSide(); renderMain(); } ghCommit(false); }
  }
  if (e.key === 'Escape') closeDrawer();
});
window.addEventListener('beforeunload', () => { clearTimeout(saveT); saveLocal(); });

/* ---------- start ---------- */
(function boot(){
  const saved = lsGet(LS_STATE, null);
  if (saved && saved.meta) S = saved;
  else S = clone(window.SF_SAMPLE || starterState());
  normalize();
  UI.sceneId = (allScenes()[0] || {}).id || null;
  UI.saveText = '이 브라우저에 저장됨';
  relintAll();
  applyView();
  render();
  applyView();
  computeChanges();
})();
})();

</script>
</body>
